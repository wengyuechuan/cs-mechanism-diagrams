ference": "references/07_强化学习与智能体/P006/figures/P006_F2_p03.svg", "page_preview": "references/07_强化学习与智能体/P006/figures/page_03.png", "crop_bbox": [22.0, 59.99761962890625, 590.0, 261.965087890625], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L09", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P007_F2_p03", "paper_id": "P007", "title": "Towards Scalable 3D Anomaly Detection and Localization: A Benchmark via 3D Anomaly Synthesis and A Self-Supervised Learning Network", "venue": "CVPR", "year": 2024, "category": "08_训练策略与自监督", "diagram_type": "方法流程图", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Pipeline for anomaly synthesis built upon the Anomaly-ShapeNet Dataset. Selected normal samples are pro- cessed through a mesh subdivision module to attain a more uni- form point cloud distribution. We employ Blender to introduce defects into the refined samples, and utilize CloudCompare soft- ware to acquire 3D anomaly ground truth.", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Li_Towards_Scalable_3D_Anomaly_Detection_and_Localization_A_Benchmark_via_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Li_Towards_Scalable_3D_Anomaly_Detection_and_Localization_A_Benchmark_via_CVPR_2024_paper.pdf", "local_pdf": "references/08_训练策略与自监督/P007/paper.pdf", "preview": "references/08_训练策略与自监督/P007/figures/P007_F2_p03.png", "vector_reference": "references/08_训练策略与自监督/P007/figures/P007_F2_p03.svg", "page_preview": "references/08_训练策略与自监督/P007/figures/page_03.png", "crop_bbox": [303.0, 171.15499877929688, 590.0, 424.0801086425781], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L01", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P007_F3_p04", "paper_id": "P007", "title": "Towards Scalable 3D Anomaly Detection and Localization: A Benchmark via 3D Anomaly Synthesis and A Self-Supervised Learning Network", "venue": "CVPR", "year": 2024, "category": "08_训练策略与自监督", "diagram_type": "训练机制与学习流程", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3. Overview of the Iterative Mask Reconstruction Network (IMRNet) Pipeline. (a) Training Phase: The standard training point cloud is initially converted to point-patch format using the Geometry-aware Point-cloud Sampling (GPS) module. Following this, random masking is applied to the point-patches, which are then reconstructed by a network comprising an Autoencoder-based Transformer and a lightweight prediction head, operating in a self-supervised paradigm. (b) Testing Phase: The input point cloud is subjected to a reconstruction process mirroring the training procedure. The reconstructed point cloud is cyclically fed back into the reconstruction network as input for several iterations. Ultimately, a comparative analysis is performed between the reconstructed and the original point clouds at both the point cloud and feature levels to derive the final anomaly score map.", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Li_Towards_Scalable_3D_Anomaly_Detection_and_Localization_A_Benchmark_via_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Li_Towards_Scalable_3D_Anomaly_Detection_and_Localization_A_Benchmark_via_CVPR_2024_paper.pdf", "local_pdf": "references/08_训练策略与自监督/P007/paper.pdf", "preview": "references/08_训练策略与自监督/P007/figures/P007_F3_p04.png", "vector_reference": "references/08_训练策略与自监督/P007/figures/P007_F3_p04.svg", "page_preview": "references/08_训练策略与自监督/P007/figures/page_04.png", "crop_bbox": [22.0, 59.999786376953125, 590.0, 332.52215576171875], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L09", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P008_F1_p01", "paper_id": "P008", "title": "VoCo: A Simple-yet-Effective Volume Contrastive Learning Framework for 3D Medical Image Analysis", "venue": "CVPR", "year": 2024, "category": "08_训练策略与自监督", "diagram_type": "训练机制与学习流程", "figure_number": "1", "pdf_page": 1, "caption": "Figure 1. (a) In 3D medical images, the contextual positions, i.e., the geometric relations between different organs are relatively con- sistent. (b) Aiming to leverage contextual position priors for pre- training, we proposed a Volume Contrast (VoCo) framework for 3D Medical Image Analysis.", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.pdf", "local_pdf": "references/08_训练策略与自监督/P008/paper.pdf", "preview": "references/08_训练策略与自监督/P008/figures/P008_F1_p01.png", "vector_reference": "references/08_训练策略与自监督/P008/figures/P008_F1_p01.svg", "page_preview": "references/08_训练策略与自监督/P008/figures/page_01.png", "crop_bbox": [303.0, 219.69786071777344, 590.0, 392.1921691894531], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L09", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "topic_review_note": "人工复核：按具体方法主题修正原自动关键词归类"}, {"id": "P008_F2_p02", "paper_id": "P008", "title": "VoCo: A Simple-yet-Effective Volume Contrastive Learning Framework for 3D Medical Image Analysis", "venue": "CVPR", "year": 2024, "category": "08_训练策略与自监督", "diagram_type": "机制示意与总体框架", "figure_number": "2", "pdf_page": 2, "caption": "Figure 2. Typical contrastive learning frameworks. (a) Instance-level contrastive learning [10, 11, 29, 22, 7] employs strong data augmentation or model perturbation on input data to acquire different views of instance, then regularizes their consistency. (b) Prototype- level contrastive learning [5, 6, 56, 45, 15, 16] conducts (1) online clustering or (2) randomly initialize then online update process to obtain prototypes as class assignments, then leverage the prototypes to contrast each input image. (c) Our VoCo follows the idea of prototype-level contrastive learning. Specifically, instead of using time-consuming online clustering and updating procedures, we leverage the valuable contextual position priors of 3D medical images and leverage the base crops to generate prototypes (bases).", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.pdf", "local_pdf": "references/08_训练策略与自监督/P008/paper.pdf", "preview": "references/08_训练策略与自监督/P008/figures/P008_F2_p02.png", "vector_reference": "references/08_训练策略与自监督/P008/figures/P008_F2_p02.svg", "page_preview": "references/08_训练策略与自监督/P008/figures/page_02.png", "crop_bbox": [22.0, 59.996337890625, 590.0, 182.1140899658203], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L09", "visual_style": "V01", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P008_F3_p04", "paper_id": "P008", "title": "VoCo: A Simple-yet-Effective Volume Contrastive Learning Framework for 3D Medical Image Analysis", "venue": "CVPR", "year": 2024, "category": "08_训练策略与自监督", "diagram_type": "机制示意与总体框架", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3. The overall framework of VoCo. VoCo contains a prediction branch and a regularization branch. The prediction branch is responsible for predicting contextual positions between different sub-volumes. The regularization branch is employed to enforce the feature discrepancy between different bases, which aims to learn more discriminative class assignments.", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.pdf", "local_pdf": "references/08_训练策略与自监督/P008/paper.pdf", "preview": "references/08_训练策略与自监督/P008/figures/P008_F3_p04.png", "vector_reference": "references/08_训练策略与自监督/P008/figures/P008_F3_p04.svg", "page_preview": "references/08_训练策略与自监督/P008/figures/page_04.png", "crop_bbox": [22.0, 60.00065612792969, 590.0, 283.3691101074219], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L04", "visual_style": "V03", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P009_F2_p04", "paper_id": "P009", "title": "Querying as Prompt: Parameter-Efficient Learning for Multimodal Language Model", "venue": "CVPR", "year": 2024, "category": "06_多模态与跨模态融合", "diagram_type": "注意力与信息交互", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Illustration of our Querying as Prompt method in the pre-trained Language Model. The Learnable Querying Prompts, along with text embedding, are jointly input into the language model. Text information is integrated into the Querying Prompt through the frozen self-attention layer, resulting in a Text-conditioned Querying Prompt. Subsequently, the Text-conditioned Querying Prompt interacts with multimodal embeddings through the Text-conditioned Resampler module, facilitating Modality Adaptation. After obtaining text-relevant multimodal information, it undergoes Domain Adaptation by combining with text embedding through a FFN layer and an Adapter layer.", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Liang_Querying_as_Prompt_Parameter-Efficient_Learning_for_Multimodal_Language_Model_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Liang_Querying_as_Prompt_Parameter-Efficient_Learning_for_Multimodal_Language_Model_CVPR_2024_paper.pdf", "local_pdf": "references/06_多模态与跨模态融合/P009/paper.pdf", "preview": "references/06_多模态与跨模态融合/P009/figures/P009_F2_p04.png", "vector_reference": "references/06_多模态与跨模态融合/P009/figures/P009_F2_p04.svg", "page_preview": "references/06_多模态与跨模态融合/P009/figures/page_04.png", "crop_bbox": [22.0, 62.540977478027344, 590.0, 287.2432861328125], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L04", "visual_style": "V01", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P010_F1_p03", "paper_id": "P010", "title": "Clustering for Protein Representation Learning", "venue": "CVPR", "year": 2024, "category": "11_因果与AI科学机制", "diagram_type": "方法流程图", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1. Overview of our iterative neural clustering pipeline for protein representation learning: (a) input protein with amino acids, (b) iterative clustering algorithm which repeatedly stacks three steps ⟳(4⇤5), (c) output can be seen as the critical amino acids of the protein, (d) output amino acids used for classiﬁcation. The details of our iterative neural clustering method can be seen in §3.2.", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Quan_Clustering_for_Protein_Representation_Learning_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Quan_Clustering_for_Protein_Representation_Learning_CVPR_2024_paper.pdf", "local_pdf": "references/11_因果与AI科学机制/P010/paper.pdf", "preview": "references/11_因果与AI科学机制/P010/figures/P010_F1_p03.png", "vector_reference": "references/11_因果与AI科学机制/P010/figures/P010_F1_p03.svg", "page_preview": "references/11_因果与AI科学机制/P010/figures/page_03.png", "crop_bbox": [22.0, 45.50408935546875, 590.0, 188.0940704345703], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L05", "visual_style": "V05", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P010_F2_p04", "paper_id": "P010", "title": "Clustering for Protein Representation Learning ure. The layerwise [cls] embedding is passed through the projection network to generate task-specific query representations which are then matched with the prompt-keys using cosine similarity to get the similarity values of prompt-generators. The prompt generators are applied over the shared embeddings to generate input specific prompt components. A weighted average of these prompt components are calculated with the corresponding cosine similarity value as weights to get the input specific key and value prompts which are applied to the pre-trained model. The learnable components are highlighted in green, the frozen components are highlighted in grey.", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Roy_Convolutional_Prompting_meets_Language_Models_for_Continual_Learning_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Roy_Convolutional_Prompting_meets_Language_Models_for_Continual_Learning_CVPR_2024_paper.pdf", "local_pdf": "references/01_视觉网络与编码解码/P011/paper.pdf", "preview": "references/01_视觉网络与编码解码/P011/figures/P011_F1_p03.png", "vector_reference": "references/01_视觉网络与编码解码/P011/figures/P011_F1_p03.svg", "page_preview": "references/01_视觉网络与编码解码/P011/figures/page_03.png", "crop_bbox": [22.0, 59.998992919921875, 590.0, 299.0059509277344], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L04", "visual_style": "V02", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P012_F1_p04", "paper_id": "P012", "title": "OmniVec2 - A Novel Transformer based Network for Large Scale Multimodal and Multitask Learning", "venue": "CVPR", "year": 2024, "category": "02_Transformer与注意力", "diagram_type": "注意力与信息交互", "figure_number": "1", "pdf_page": TS and FAS. After the generator predicts the tokens, TCTS exploits the text condition to detect misaligned tokens and outputs the score map. Meanwhile, FAS splits the tokens according to the frequency using the self-attention map from the generator, performing revocable sampling to high-frequency split and persistent sampling to low-frequency split. The adaptive sampling predicts ˆx0 and decide a few of the locations to mask according to xt. The token maps produced by FAS is combined with the score map to predict xt−1. After iterative process, our model removes all the masks and generates x0.", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Lee_Text-Conditioned_Sampling_Framework_for_Text-to-Image_Generation_with_Masked_Generative_Models_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Lee_Text-Conditioned_Sampling_Framework_for_Text-to-Image_Generation_with_Masked_Generative_Models_ICCV_2023_paper.pdf", "local_pdf": "references/04_生成模型与扩散机制/P019/paper.pdf", "preview": "references/04_生成模型与扩散机制/P019/figures/P019_F4_p05.png", "vector_reference": "references/04_生成模型与扩散机制/P019/figures/P019_F4_p05.svg", "page_preview": "references/04_生成模型与扩散机制/P019/figures/page_05.png", "crop_bbox": [22.0, 59.99940490722656, 590.0, 221.21409606933594], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L04", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P020_F1_p03", "paper_id": "P020", "title": "Learning Spatial-context-aware Global Visual Feature Representation for Instance Image Retrieval", "venue": "ICCV", "year": 2023, "category": "05_检索增强与知识系统", "diagram_type": "注意力与信息交互", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1. Overview of our framework. After an initial feature extraction by a CNN backbone, two branches of “Visual Feature Branch” and “Spatial Context Branch” are used to extract visual and spatial context information. After that, a cross-attention module is used to fuse the visual feature and the corresponding spatial context feature to generate spatial-context-aware visual representations for images. In particular, “GMM” denotes the Gaussian Mixture Model process, and “GP+W” refers to global pooling followed by whitening.", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Zhang_Learning_Spatial-context-aware_Global_Visual_Feature_Representation_for_Instance_Image_Retrieval_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Zhang_Learning_Spatial-context-aware_Global_Visual_Feature_Representation_for_Instance_Image_Retrieval_ICCV_2023_paper.pdf", "local_pdf": "references/05_检索增强与知识系统/P020/paper.pdf", "preview": "references/05_检索增强与知识系统/P020/figures/P020_F1_p03.png", "vector_reference": "references/05_检索增强与知识系统/P020/figures/P020_F1_p03.svg", "page_preview": "references/05_检索增强与知识系统/P020/figures/page_03.png", "crop_bbox": [22.0, 60.861595153808594, 590.0, 203.06349182128906], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L04", "visual_style": "V03", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P021_F2_p04", "paper_id": "P021", "title": "Preventing Zero-Shot Transfer Degradation in Continual Learning of Vision-Language Models", "venue": "ICCV", "year": 2023, "category": "06_多模态与跨模态融合", "diagram_type": "训练机制与学习流程", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Illustration of ZSCL in feature space. Fig. 3(a) shows the pipeline of distillation. The original and the current model encode the reference images and texts, respectively. The probability distribution of images and texts with respect to each other is distilled. Fig. 3(b) displays how distillation loss preserves the feature space. Compared with the reference dataset, the features of fine-tuning tasks lie in a small subspace. The distillation loss preserves the structure of the feature space by maintaining relative distances.", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Zheng_Preventing_Zero-Shot_Transfer_Degradation_in_Continual_Learning_of_Vision-Language_Models_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Zheng_Preventing_Zero-Shot_Transfer_Degradation_in_Continual_Learning_of_Vision-Language_Models_ICCV_2023_paper.pdf", "local_pdf": "references/06_多模态与跨模态融合/P021/paper.pdf", "preview": "references/06_多模态与跨模态融合/P021/figures/P021_F2_p04.png", "vector_reference": "references/06_多模态与跨模态融合/P021/figures/P021_F2_p04.svg", "page_preview": "references/06_多模态与跨模态融合/P021/figures/page_04.png", "crop_bbox": [22.0, 59.99992370605469, 590.0, 213.88595581054688], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L09", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P022_F2_p03", "paper_id": "P022", "title": "Scene Graph Contrastive Learning for Embodied Navigation", "venue": "ICCV", "year": 2023, "category": "03_图神经网络与关系推理", "diagram_type": "图结构与消息传递", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2: Iterative Graph Building. Illustrative example of how a scene graph is built. The agent, the room, and the objects are all added as nodes to the graph. As the agent moves in the environment, we add the objects that it sees, for instance at t=3, the coffee machine, sink, and counter- top. We also add edges that signify various relationships like Contains, On, and Sees.", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.pdf", "local_pdf": "references/03_图神经网络与关系推理/P022/paper.pdf", "preview": "references/03_图神经网络与关系推理/P022/figures/P022_F2_p03.png", "vector_reference": "references/03_图神经网络与关系推理/P022/figures/P022_F2_p03.svg", "page_preview": "references/03_图神经网络与关系推理/P022/figures/page_03.png", "crop_bbox": [22.0, 59.515716552734375, 309.0, 274.8365173339844], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L05", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P022_F3_p04", "paper_id": "P022", "title": "Scene Graph Contrastive Learning for Embodied Navigation", "venue": "ICCV", "year": 2023, "category": "03_图神经网络与关系推理", "diagram_type": "图结构与消息传递", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3: Scene Graph Contrastive (SGC) framework. We show a standard Embodied-AI model which takes, as input, an egocentric RGB observation and outputs a policy and scalar value for RL training. We supplement this with our Scene Graph Contrastive Model. It takes as input, the belief, bt, and graph representation gt, at each time step. The prediction of this model, pt is passed into the Scene Graph Contrastive Loss. The SGC Loss optimizes the model to predict which graph embedding belongs to a particular time step, t.", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.pdf", "local_pdf": "references/03_图神经网络与关系推理/P022/paper.pdf", "preview": "references/03_图神经网络与关系推理/P022/figures/P022_F3_p04.png", "vector_reference": "references/03_图神经网络与关系推理/P022/figures/P022_F3_p04.svg", "page_preview": "references/03_图神经网络与关系推理/P022/figures/page_04.png", "crop_bbox": [22.0, 60.003143310546875, 590.0, 256.00048828125], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L09", "visual_style": "V01", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P023_F2_p04", "paper_id": "P023", "title": "Multiple Instance Learning Framework with Masked Hard Instance Mining for Whole Slide Image Classification", "venue": "ICCV", "year": 2023, "category": "08_训练策略与自监督", "diagram_type": "注意力与信息交互", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2: Overview of proposed MHIM-MIL. A momentum teacher is used to compute attention scores for all instances. We mask instances based on attention with hard mining strategies and feed the remaining to the student model. The student is updated by a consistency loss term Lcon and a label error loss term Lcls. The teacher parameters are updated with an Exponential Moving Average (EMA) of the student parameters without gradient updates. In the inference phase, we use the complete input instances and the student model only.", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Tang_Multiple gation Framework for Distributed Machine Learning over Non-IID Data and Time-varying Communication Links", "venue": "NeurIPS", "year": 2024, "category": "10_计算机系统与数据流程", "diagram_type": "网络架构图", "figure_number": "1", "pdf_page": 5, "caption": "Figure 1: The Overview of HyperPrism Framework. ①Device i executes local update on its own dataset. ② Device i adaptively generates degrees of pθ and pφ for the representation and decision parts by hypernetworks. ③Device i maps the model to the mirror space by raising the parameters with the degree of power pθ and pφ, respectively. ④Device i communicates with its neighbors exchanging local models. ⑤Device i aggregates received models in mirror space with WPM. ⑥Device i inverses the model to primal space by the degree of power pθ and pφ, then finishes the round.", "source_url": "https://proceedings.neurips.cc/paper_files/paper/2024/hash/15e5fccdfeb10bb54f8e74944de1c8bf-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/15e5fccdfeb10bb54f8e74944de1c8bf-Paper-Conference.pdf", "local_pdf": "references/10_计算机系统与数据流程/P055/paper.pdf", "preview": "references/10_计算机系统与数据流程/P055/figures/P055_F1_p05.png", "vector_reference": "references/10_计算机系统与数据流程/P055/figures/P055_F1_p05.svg", "page_preview": "references/10_计算机系统与数据流程/P055/figures/page_05.png", "crop_bbox": [22.0, 60.00547790527344, 590.0, 230.88662719726562], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L04", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P056_F1_p04", "paper_id": "P056", "title": "Goal Reduction with Loop-Removal Accelerates RL and Models Human Brain Activity in Goal-Directed Learning", "venue": "NeurIPS", "y style": "L05", "visual_style": "V05", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P102_F3_p04", "paper_id": "P102", "title": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "venue": "ACM TOG / SIGGRAPH", "year": 2022, "category": "09_三维视觉与神经渲染", "diagram_type": "机制示意与总体框架", "figure_number": "3", "pdf_page": 4, "caption": "Fig. 3. Illustration of the multiresolution hash encoding in 2D. (1) for a given input coordinate x, we find the surrounding voxels at 𝐿resolution levels and assign indices to their corners by hashing their integer coordinates. (2) for all resulting corner indices, we look up the corresponding 𝐹-dimensional feature vectors from the hash tables 𝜃𝑙and (3) linearly interpolate them according to the relative position of x within the respective 𝑙-th voxel. (4) we concatenate the result of each level, as well as auxiliary inputs 𝜉∈R𝐸, producing the encoded MLP input 𝑦∈R𝐿𝐹+𝐸, which (5) is evaluated last. To train the encoding, loss gradients are backpropagated through the MLP (5), the concatenation (4), the linear interpolation (3), and then accumulated in the looked-up feature vectors.", "source_url": "https://nvlabs.github.io/instant-ngp/", "pdf_url": "https://nvlabs.github.io/instant-ngp/assets/mueller2022instant.pdf", "local_pdf": "references/03_图神经网络与关系推理/P102/paper.pdf", "preview": "references/03_图神经网络与关系推理/P102/figures/P102_F3_p04.png", "vector_reference": "references/03_图神经网络与关系推理/P102/figures/P102_F3_p04.svg", "page_preview": "references/03_图神经网络与关系推理/P102/figures/page_04.png", "crop_bbox": [22.0, 67.3450927734375, 590.0, 259.1142578125], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L01", "visual_style": "V03", "style_review": "人  Task structure and seRNNs. a, We use regularization to influence  network structure during training to promote smaller network weights and  hence a sparser connectome. b, Through regularization, we embed RNNs in  Euclidean space by assigning units a location on an even 5 × 5 × 4 grid. We show  a schematic of a six-node network in its space. c, We similarly embed RNNs in a  topological space, guiding the pruning process towards efficient intra-network  communication operationalized by a weighted communicability measure (see  main text). The weighted communicability term is shown for the same network.  d, When these constraints are placed within a joint regularization term, networks  are incentivized to strengthen short connections, which are core to the networks  topological structure, and weaken long connections, which are peripheral.  Networks are generally incentivized to weaken connections while optimizing  task performance. e, In the main study, we trained 1,000 L1-regularized RNNs as a  baseline. L1 networks optimize task performance while minimizing the strength  of their absolute weights (W). The network receives task inputs from an eight-", "source_url": "https://www.nature.com/articles/s42256-023-00748-9", "pdf_url": "https://www.nature.com/articles/s42256-023-00748-9.pdf", "local_pdf": "references/11_因果与AI科学机制/P106/paper.pdf", "preview": "references/11_因果与AI科学机制/P106/figures/P106_F1_p02.png", "vector_reference": "references/11_因果与AI科学机制/P106/figures/P106_F1_p02.svg", "page_preview": "references/11_因果与AI科学机制/P106/figures/page_02.png", "crop_bbox": [22.0, 345.3480224609375, 175.2509002685547, 506.5412902832031], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "左侧空间网络约束机制，剔除右侧统计热图", "review_level": "thumbnail diagram-type and style review", "layout_style": "L05", "visual_style": "V05", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P107_F1_p02", "paper_id": "P107", "title": "Augmenting large language models with chemistry tools", "venue": "Nature Machine Intelligence", "year": 2024, "category": "11_因果与AI科学机制", "diagram_type": "机制示意与总体框架", "figure_number": "1", "pdf_page": 2, "caption": "Fig. 1 | Overview and toolset. a, An overview of the task-solving process. Using  a variety of chemistry-related packages and software, a set of tools is created.  These tools and a user input are then given to an LLM. The LLM proceeds  through an automatic, iterative chain-of-thought process, deciding on its path,", "source_url": "https://www.nature.com/articles/s42256-024-00832-8", "pdf_url": "https://www.nature.com/articles/s42256-024-00832-8.pdf", "local_pdf": "references/12_通用方法与总体框架/P107/paper.pdf", "preview": "references/12_通用方法与总体框架/P107/figures/P107_F1_p02.png", "vector_reference": "references/12_通用方法与总体框架/P107/figures/P107_F1_p02.svg", "page_preview": "references/12_通用方法与总体框架/P107/figures/page_02.png", "crop_bbox": [22.0, 55.9012451171875, 573.2760009765625, 319.22833251953125], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L07", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "topic_review_note": "按来源论文主要方法主题归类；跨领域风格另由布局与视觉标签表达"}, {"id": "P108_F1_p03", "paper_id": "P108", "title": "Deep learning of causal structures in high dimensions under data limitations", "venue": "Nature Machine Intelligence", "year": 2023, "category": "11_因果与AI科学机制", "diagram_type": "图结构与消息传递", "figure_number": "1", "pdf_page": 3, "caption": "Fig. 1 | Conceptual overview of the proposed learning scheme and its  application in large-scale biological experiments. The neural architecture  learns causal structures by combining data and prior knowledge, resulting in  a graph G intended to represent causal, not just correlational, relationships  between system variables. In an abstract workflow (left), empirical data from  a specific system are combined with prior causal knowledge to estimate the  unknown causal structure. In the biological problem workflow (right), data  are gathered from a specific biological system, and causal prior knowledge is  derived from established science or interventional experiments on the system.  The model seeks to generalize from the limited inputs to learn a global graph,  spanning all system variables.", "source_url": "https://www.nature.com/articles/s42256-023-00744-z", "pdf_url": "https://www.nature.com/articles/s42256-023-00744-z.pdf", "local_pdf": "references/11_因果与AI科学机制/P108/paper.pdf", "preview": "references/11_因果与AI科学机制/P108/figures/P108_F1_p03.png", "vector_reference": "references/11_因果与AI科学机制/P108/figures/P108_F1_p03.svg", "page_preview": "references/11_因果与AI科学机制/P108/figures/page_03.png", "crop_bbox": [22.0, 26.03582763671875, 300.63800048828125, 377.7744140625], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L09", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P108_F2_p03", "paper_id": "P108", "title": "Deep learning of causal structures in high dimensions under data limitations", "venue": "Nature Machine Intelligence", "year": 2023, "category": "11_因果与AI科学机制", "diagram_type": "图结构与消息传递", "figure_number": "2", "pdf_page": 3, "caption": "Fig. 2 | Overview of the D2CL architecture, training and inference. D2CL  combines empirical data on multiple variables with prior causal knowledge to  learn causal relationships between variables. For any pair of variables Xi and Xj  (corresponding to two columns of the input data matrix), D2CL seeks to learn  whether Xi has a causal influence on Xj, Xj on Xi, or neither. This is done using a  neural architecture with two components: a CNN tower aimed at learning  distributional features and a GNN tower that detects structural regularities.   For an ordered pair (Xi, Xj), the CNN tower captures distributional information   via a density estimate that traverses the tower to form an embedding. The GNN  tower extracts a subgraph from an initial graph ̂G0 and computes an embedding  containing structural information on the neighbourhood of the nodes. The CNN  and GNN embeddings are then merged through multiple layers, which finally  output the probability of a directed causal relationship. The input causal  information is used to provide a training signal (see main text for details).   During inference, the network generalizes beyond the initial inputs to provide   an estimate of the global graph spanning all variables of interest.", "source_url": "https://www.nature.com/articles/s42256-023-00744-z", "pdf_url": "https://www.nature.com/articles/s42256-023-00744-z.pdf", "local_pdf": "references/11_因果与AI科学机制/P108/paper.pdf", "preview": "references/11_因果与AI科学机制/P108/figures/P108_F2_p03.png", "vector_reference": "references/11_因果与AI科学机制/P108/figures/P108_F2_p03.svg", "page_preview": "references/11_因果与AI科学机制/P108/figures/page_03.png", "crop_bbox": [294.63800048828125, 47.92475509643555, 573.2760009765625, 228.70970153808594], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L07", "visual_style": "V05", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classi d. The traversal path for the image patches is determined by the order of eigenvectors. The 1st eigenvector traverses the foreground/background regions, the 2nd eigenvector focuses on the next most salient structures, and each subsequent eigenvector progressively captures finer details in the image.", "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Dastani_Spectral_State_Space_Model_for_Rotation-Invariant_Visual_Representation_Learning_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Dastani_Spectral_State_Space_Model_for_Rotation-Invariant_Visual_Representation_Learning_CVPR_2025_paper.pdf", "local_pdf": "references/02_Transformer与注意力/P121/paper.pdf", "preview": "references/02_Transformer与注意力/P121/figures/P121_F2_p03.png", "vector_reference": "references/02_Transformer与注意力/P121/figures/P121_F2_p03.svg", "page_preview": "references/02_Transformer与注意力/P121/figures/page_03.png", "crop_bbox": [22.0, 59.99737548828125, 590.0, 227.95933532714844], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "仅裁出机制图形；图注见索引", "review_level": "thumbnail diagram-type and style review", "layout_style": "L06", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification"}, {"id": "P121_F3_p05", "paper_id": "P121", "title": "Spectral State Space Model for Rotation-Invariant Visual Representation Learning", "venue": "CVPR", "year": 2025, "category": "02_Transformer与注意力", "diagram_type": "网络架构图", "figure_number": "3", "pdf_page": 5, "caption": "Figure 3. An overview of the proposed method. Our network consists of two primary components: the RFN module, which normalizes feature orientation to ensure consistency across different perspectives, and a series of Spectral VMamba blocks that process data in three stages: (1) Spectral Traversal Scan (S on_Models_with_Multi-Modal_Information_for_Multi-task_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Ramanathan_ModalTune_Fine-Tuning_Slide-Level_Foundation_Models_with_Multi-Modal_Information_for_Multi-task_ICCV_2025_paper.pdf", "local_pdf": "references/06_多模态与跨模态融合/P148/paper.pdf", "preview": "references/06_多模态与跨模态融合/P148/figures/P148_F2_p04.png", "vector_reference": "references/06_多模态与跨模态融合/P148/figures/P148_F2_p04.svg", "page_preview": "references/06_多模态与跨模态融合/P148/figures/page_04.png", "crop_bbox": [22.0, 60.00141906738281, 590.0, 304.5851135253906], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "机制图形裁剪；图注见元数据", "batch": "v2-2025-expansion", "layout_style": "L04", "visual_style": "V01", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "review_level": "thumbnail diagram-type and style review"}, {"id": "P149_F1_p01", "paper_id": "P149", "title": "Disentangled World Models: Learning to Transfer Semantic Knowledge from Distracting Videos for Reinforcement Learning", "venue": "ICCV", "year": 2025, "category": "07_强化学习与智能体", "diagram_type": "机制示意与总体框架", "figure_number": "1", "pdf_page": 1, "caption": "Figure 1. Overview of our proposed framework. The key idea is to leverage distracting videos for semantic knowledge transfer, enabling the downstream agent to improve sample efficiency on unseen tasks.", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Wang_Disentangled_World_Models_Learning_to_Transfer_Semantic_Knowledge_from_Distracting_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Wang_Disentangled_World_Models_Learning_to_Transfer_Semantic_Knowledge_from_Distracting_ICCV_2025_paper.pdf", "local_pdf": "references/07_强化学习与智能体/P149/paper.pdf", "preview": "references/07_强化学习与智能体/P149/ rvised_Learning_ICCV_2025_paper.pdf", "local_pdf": "references/04_生成模型与扩散机制/P150/paper.pdf", "preview": "references/04_生成模型与扩散机制/P150/figures/P150_F1_p01.png", "vector_reference": "references/04_生成模型与扩散机制/P150/figures/P150_F1_p01.svg", "page_preview": "references/04_生成模型与扩散机制/P150/figures/page_01.png", "crop_bbox": [303.0, 233.68170166015625, 590.0, 397.7129821777344], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "机制图形裁剪；图注见元数据", "batch": "v2-2025-expansion", "layout_style": "L07", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "review_level": "thumbnail diagram-type and style review"}, {"id": "P150_F2_p04", "paper_id": "P150", "title": "Harnessing Text-to-Image Diffusion Models for Point Cloud Self-Supervised Learning", "venue": "ICCV", "year": 2025, "category": "04_生成模型与扩散机制", "diagram_type": "网络架构图", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Overall framework of our PointSD. In the first stage, the 3D encoder extracts features to serve as the condition for guiding the denoising process, forming a point-to-image diffusion framework. In the second stage, feature alignment is performed between 3D features and SD features to boost 3D representation learning.", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Chen_Harnessing_Text-to-Image_Diffusion_Models_for_Point_Cloud_Self-Supervised_Learning_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Chen_Harnessing_Text-to-Image_Diffusion_Models_for_Point_Cloud_Self-Supervised_Learning_ICCV_2025_paper.pdf", "local_pdf": "references/04_生成模型与扩散机制/P150/paper.pdf", "preview": "references/04_生成模型与扩散机制/P150/figures/P150_F2_p04.png", "vector_reference": "references/04_生成模型与扩散机制/P150/figures/P150_F2_p04.svg", "page_preview": "references/04_生成模型与扩散机制/P150/figures/page_04.png", "crop_bbox": [22.0, 59.99638366699219, 590.0, 235.28897094726562], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "机制图形裁剪；图注见元数据", "batch": "v2-2025-expansion", "layout_style": "L04", "visual_style": "V03", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "review_level": "thumbnail diagram-type and style review"}, {"id": "P151_F2_p03", "paper_id": "P151", "title": "Prior-aware Dynamic Temporal Modeling Framework for Sequential 3D Hand Pose Estimation", "venue": "ICCV", "year": 2025, "category": "09_三维视觉与神经渲染", "diagram_type": "网络架构图", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Overall Architecture. Our method comprises three primary components: the Dynamic Spatio-temporal Block, the Global Temporal Block, and the Hand Prior Memory. The Dynamic Spatio-temporal Block employs a dual-branch structure to model joint-level spatial and temporal relationships, while the Global Temporal Block extracts hand-level temporal information. We leverage hand-level temporal information to update the hand prior memory, injecting this prior knowledge into the Dynamic Spatio-temporal Block to provide robust disambiguation cues for spatio-temporal interactions. Here, N represents the number of stacked blocks.", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Ren_Prior-aware_Dynamic_Temporal_Modeling_Framework_for_Sequential_3D_Hand_Pose_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Ren_Prior-aware_Dynamic_Temporal_Modeling_Framework_for_Sequential_3D_Hand_Pose_ICCV_2025_paper.pdf", "local_pdf": "references/09_三维视觉与神经渲染/P151/paper.pdf", "preview": "references/09_三维视觉与神经渲染/P151/figures/P151_F2_p03.png", "vector_reference": "references/09_三维视觉与神经渲染/P151/figures/P151_F2_p03.svg", "page_preview": "references/09_三维视觉与神经渲染/P151/figures/page_03.png", "crop_bbox": [22.0, 63.34162139892578, 590.0, 217.87709045410156], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "机制图形裁剪；图注见元数据", "batch": "v2-2025-expansion", "layout_style": "L04", "visual_style": "V01", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "review_level": "thumbnail diagram-type and style review"}, {"id": "P152_F1_p02", "paper_id": "P152", "title": "S3R-GS: Streamlining the Pipeline for Large-Scale Street Scene Reconstruction", "venue": "ICCV", "year": 2025, "category": "09_三维视觉与神经渲染", "diagram_type": "方法流程图", "figure_number": "1", "pdf_page": 2, "caption": "Figure 1. Comparison of Reconstruction Pipelines. (a) In the conventional pipeline, to render the view at timestep t, each object’s Gaussians are sequentially transformed from their respective local coordinate system to the global coordinate system. Next, all Gaussians in the global coordinate system are projected onto the camera plane. Finally, the Gaussians within the view frustum are rendered using α-blending, regardless of distance. (b) Our streamlined reconstruction pipeline first employs temporal visibility to identify the visible Gaussians at timestep t. To avoid unnecessary transformations, we use instance-specific projection matrices to directly project all Gaussians onto the camera plane. Subsequently, we apply the Adaptive LOD method to cull distant Gaussians whose 2D scales are smaller than the LOD threshold. We rasterize the remaining Gaussians with α-blending. Finally, we update the temporal visibility using Gaussian visibility obtained by the rendering process. (c) Our pipeline eliminates these redundancies, significantly accelerating the reconstruction process.", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.pdf", "local_pdf": "references/10_计算机系统与数据流程/P152/paper.pdf", "preview": "references/10_计算机系统与数据流程/P152/figures/P152_F1_p02.png", "vector_reference": "references/10_计算机系统与数据流程/P152/figures/P152_F1_p02.svg", "page_preview": "references/10_计算机系统与数据流程/P152/figures/page_02.png", "crop_bbox": [22.0, 62.28501892089844, 590.0, 180.2124481201172], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "机制图形裁剪；图注见元数据", "batch": "v2-2025-expansion", "layout_style": "L09", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "review_level": "thumbnail diagram-type and style review"}, {"id": "P152_F2_p03", "paper_id": "P152", "title": "S3R-GS: Streamlining the Pipeline for Large-Scale Street Scene Reconstruction", "venue": "ICCV", "year": 2025, "category": "09_三维视觉与神经渲染", "diagram_type": "方法流程图", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. S3R-GS Framework. At the scene modeling stage, S3R-GS first leverages a BEV-semantic initialization augmentation method to supplement the points of tall structures in street scenes. Next, tracked 2D boxes to distinguish between dynamic and static elements, integrating a NeuralODE model for precise, continuous object poses. These designs enable S3R-GS to generalize effectively to in-the-wild scenarios. During scene reconstruction, S3R-GS identifies visible Gaussians at each time step and projects them onto the 2D image plane using instance-specific projection matrices. To efficiently render distant content, S3R-GS employs an adaptive strategy that (1) filters out distant 3D Gaussians with small projected 2D scales, (2) randomly culls Gaussians based on depth, (3) introduces noisy offsets to the remaining distant Gaussians, and (4) queries their colors from a distance-aware neural field. After that, the remaining Gaussians are rasterized using α-blending. Our pipeline reduces computational redundancy, significantly lowering per-viewpoint reconstruction costs.", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.pdf", "local_pdf": "references/10_计算机系统与数据流程/P152/paper.pdf", "preview": "references/10_计算机系统与数据流程/P152/figures/P152_F2_p03.png", "vector_reference": "references/10_计算机系统与数据流程/P152/figures/P152_F2_p03.svg", "page_preview": "references/10_计算机系统与数据流程/P152/figures/page_03.png", "crop_bbox": [22.0, 66.77508544921875, 590.0, 239.73512268066406], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "机制图形裁剪；图注见元数据", "batch": "v2-2025-expansion", "layout_style": "L04", "visual_style": "V04", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "review_level": "thumbnail diagram-type and style review", "topic_review_note": "按来源论文主要方法主题归类；跨领域风格另由布局与视觉标签表达"}, {"id": "P153_F2_p03", "paper_id": "P153", "title": "Causality-guided Prompt Learning for Vision-language Models via Visual Granulation", "venue": "ICCV", "year": 2025, "category": "06_多模态与跨模态融合", "diagram_type": "训练机制与学习流程", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Architecture of CaPL, where (a) is the training stage and (b) is the inference stage. xi and x are visual features, si and di are the non-individualized and individuali gled loss are denoted by CCL, CE and LDL in the diagram, respectively.", "source_url": "https://aclanthology.org/2025.acl-long.247/", "pdf_url": "https://aclanthology.org/2025.acl-long.247.pdf", "local_pdf": "references/08_训练策略与自监督/P179/paper.pdf", "preview": "references/08_训练策略与自监督/P179/figures/P179_F2_p03.png", "vector_reference": "references/08_训练策略与自监督/P179/figures/P179_F2_p03.svg", "page_preview": "references/08_训练策略与自监督/P179/figures/page_03.png", "crop_bbox": [22.0, 58.84696960449219, 573.2760009765625, 298.2375183105469], "selection": "caption keyword + vector geometry", "review_status": "已完成机制类型与风格缩略图检查；细节请核对原PDF", "has_possible_statistical_panels": false, "editable_template": false, "crop_note": "机制图形裁剪；图注见元数据", "batch": "v2-2025-expansion", "layout_style": "L02", "visual_style": "V05", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "style_review_level": "thumbnail visual classification", "review_level": "thumbnail diagram-type and style review"}, {"id": "P181_F1_p02", "paper_id": "P181", "title": "IRIS : An Iterative and Integrated Framework for Verifiable Causal Discovery in the Absence of Tabular Data", "venue": "ACL", "year": 2025, "category": "11_因果与AI科学机制", "diagram_type": "图结构与消息传递", "figure_number": "1", "pdf_page": 2, "caption": "Figure 1: Illustration of IRIS. Given initial variables, we use the Google Search API and LLMs to collect relevant documents and extract variable values, then form structured data. For hybrid causal discovery, the statistical branch uses the structured data, while the causal relation extraction branch uses the retrieved documents. Their results are merged into the final causal graph. The missing variable proposal component identifies new variables, which are iteratively fed into our framework to expand the causal graphs.", "source_url": "https://aclanthology.org/2025.acl-long.463/", "pdf_url": "https://aclanthology.org/2025.acl-long.463.pdf", "local_pdf": "references/11_因果与AI科学机制/P181/paper.pdf", "preview": "references/11_ gs\nMilad Khademi Nori∗\nElectrical and Computer Engineering\nQueen’s University\nKingston, Ontario, Canada\n19mkn1@queensu.ca\nIl-Min Kim\nElectrical and Computer Engineering\nQueen’s University\nKingston, Ontario, Canada\nilmin.kim@queensu.ca\nAbstract\nIn class-incremental learning (class-IL), models must classify all previously seen\nclasses at test time without task-IDs, leading to task confusion. Despite being\na key challenge, task confusion lacks a theoretical u", "local_pdf": "references/04_生成模型与扩散机制/P049/paper.pdf", "sha256": "545d0313f1074fbae8283992c848ed2116a2231db356fbd02497c1e4536c1a1f", "bytes": 678102, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "ReMAP: Neural Model Reprogramming with Network Inversion and Retrieval-Augmented Mapping for Adaptive Motion Forecasting", "venue": "NeurIPS", "year": 2024, "source_url": "https://proceedings.neurips.cc/paper_files/paper/2024/hash/2cdf71a65e95bf1874212f6e604c64db-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/2cdf71a65e95bf1874212f6e604c64db-Paper-Conference.pdf", "source_kind": "official_proceedings", "id": "P050", "category": "05_检索增强与知识系统", "pages": 33, "pdf_first_page_excerpt": "ReMAP: Neural Model Reprogramming with Network\nInversion and Retrieval-Augmented Mapping for\nAdaptive Motion Forecasting\nSharmita Dey∗, Sarath Ravindran Nair∗\nAbstract\nMobility impairment caused by limb loss, aging, stroke, and other movement\ndeficiencies is a significant challenge faced by millions of individuals worldwide.\nAdvanced assistive technologies, such as prostheses and orthoses, have the potential\nto greatly improve the quality of life for such individuals. A critical component\nin the design of these technologies is the accurate forecasting of reference joint\nmotion for impaired lim", "local_pdf": "references/05_ _files/paper/2024/file/05b2ea5d57ed04c1dc105658e87b137e-Paper-Conference.pdf", "source_kind": "official_proceedings", "id": "P056", "category": "11_因果与AI科学机制", "pages": 24, "pdf_first_page_excerpt": "Goal Reduction with Loop-Removal Accelerates RL\nand Models Human Brain Activity in Goal-Directed\nLearning\nHuzi Cheng\nDepartment of Psychological and Brain Sciences\nIndiana University Bloomington\nhzcheng15@gmail.com\nJoshua W. Brown\nDepartment of Psychological and Brain Sciences\nIndiana University Bloomington\njwmbrown@iu.edu\nAbstract\nGoal-directed planning presents a challenge for classical RL algorithms due to the\nvastness of the combinatorial state and goal spaces, while humans and animals\nadapt to complex environments, especially with diverse, non-stationary objectives,\noften employing interm", "local_pdf": "references/11_因果与AI科学机制/P056/paper.pdf", "sha256": "f7de209a3eddc77b99b6abaf6482f983bed181cae757cb7d801403102dd9daa1", "bytes": 1961083, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "You Only Cache Once: Decoder-Decoder Architectures for Language Models", "venue": "NeurIPS", "year": 2024, "source_url": "https://proceedings.neurips.cc/paper_files/paper/2024/hash/0df38cd13520747e1e64e5b123a78ef8-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/0df38cd13520747e1e64e5b123a78ef8-Paper-Conference.pdf", "source_kind": "official_proceedings", "id": "P057", "category": "02_Transformer与注意力", "pages": 23, "pdf_first_page_excerpt": "You Only Cache Once:\nDecoder-Decoder Architectures for Language Models\nYutao Sun∗‡†\nLi Dong∗†\nYi Zhu† Shaohan Huang†\nWenhui Wang† Shuming Ma† Quanlu Zhang† Jianyong Wang‡ Furu Wei†⋄\n‡ Tsinghua University\n† Microsoft Research\nhttps://aka.ms/GeneralAI\nAbstract\nWe introduce a decoder-decoder architecture, YOCO, for large language models,\nwhich only caches key-value pairs once. It consists of two components, i.e., a cross-\ndecoder stacked upon a self-decoder. The self-decoder efficiently encodes global\nkey-value (KV) caches that are reused by the cross-decoder via cross-attention.\nThe overall mode", "local_pdf": "references/01_视觉网络与编码解码/P057/paper.pdf", "sha256": "c3d372e316d0ae8568ce0cac0f7f620ce618c166e8a8ff19993a404ac0bc83a5", "bytes": 786906, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本", "topic_review_note": "按论文主要方法主题人工修正自动关键词标签；原下载路径保留"}, {"title": "Limits of Transformer Language Models on Learning to Compose Algorithms", "venue": "NeurIPS", "year": 2024, "source_url": "https://proceedings.neurips.cc/paper_files/paper/2024/hash/0e797d5139ad94fc2dc2080c09119f29-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/0e797d5139ad94fc2dc2080c09119f29-Paper-Conference.pdf", "source_kind": "official_proceedings", "id": "P058", "category": "02_Transformer与注意力", "pages": 44, "pdf_first_page_excerpt": "Limits of Transformer Language Models\non Learning to Compose Algorithms\nJonathan Thomm1,2∗\njthomm@ethz.ch\nGiacomo Camposampiero1,2\ngiacomo.camposampiero1@ibm.com\nAleksandar Terzic1,2\naleksandar.terzic1@ibm.com\nMichael Hersche1\nmichael.hersche@ibm.com\nBernhard Schölkopf2,3\nbs@tuebingen.mpg.de\nAbbas Rahimi1\nabr@zurich.ibm.com\n1IBM Research – Zurich, 2ETH Zurich, 3MPI Tübingen\nAbstract\nWe analyze the capabilities of Transformer language models in learning com-\npositional discrete tasks. To this end, we evaluate training LLaMA models and\nprompting GPT-4 and Gemini on four tasks demanding to learn ", "local_pdf": "references/02_Transformer与注意力/P058/paper.pdf", "sha256": "36ce72e32e7e228b9782ef379d043cde473b190d8d2d820d59ba8d80546ab1fe", "bytes": 1114847, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "Exact Conversion of In-Context Learning to Model Weights in Linearized-Attention Transformers", "venue": "ICML", "year": 2024, "source_url": "https://proceedings.mlr.press/v235/chen24r.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/chen24r/chen24r.pdf", "source_kind": "official_proceedings", "id": "P059", "category": "02_Transformer与注意力", "pages": 14, "pdf_first_page_excerpt": "Exact Conversion of In-Context Learning to Model Weights in\nLinearized-Attention Transformers\nBrian K Chen 1 2 Tianyang Hu 3 Hui Jin 3 Hwee Kuan Lee 1 2 4 5 6 7 Kenji Kawaguchi 1\nAbstract\nIn-Context Learning (ICL) has been a powerful\nemergent property of large language models that\nhas attracted increasing attention in recent years.\nIn contrast to regular gradient-based learning,\nICL is highly interpretable and does not require\nparameter updates. In this paper, we show that, for\nlinearized transformer networks, ICL can be made\nexplicit and permanent through the inclusion of\nbias terms. We mathe", "local_pdf": "references/02_Transformer与注意力/P059/paper.pdf", "sha256": "31563f7847e7c5611d53729475acae2cb3bf938894d0904f4c1c027f75f439d2", "bytes": 340291, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "Enhancing Size Generalization in Graph Neural Networks through Disentangled Representation Learning", "venue": "ICML", "year": 2024, "source_url": "https://proceedings.mlr.press/v235/huang24ac.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/huang24ac/huang24ac.pdf", "source_kind": "official_proceedings", "id": "P060", "category": "03_图神经网络与关系推理", "pages": 17, "pdf_first_page_excerpt": "Enhancing Size Generalization in Graph Neural Networks through Disentangled\nRepresentation Learning\nZheng Huang 1 Qihui Yang 2 Dawei Zhou 3 Yujun Yan 1\nAbstract\nAlthough most graph neural networks (GNNs)\ncan operate on graphs of any size, their classifica-\ntion performance often declines on graphs larger\nthan those encountered during training. Existing\nmethods insufficiently address the removal of size\ninformation from graph representations, resulting\nin sub-optimal performance and reliance on back-\nbone models. In response, we propose DISGEN,\na novel and model-agnostic framework designed\nto d", "local_pdf": "references/03_图神经网络与关系推理/P060/paper.pdf", "sha256": "f1846bf733c103346f5a9f543c7421439203de72f0dd06d8cdb8c6895c4b611e", "bytes": 1434799, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "Learning Latent Space Hierarchical EBM Diffusion Models", "venue": "ICML", "year": 2024, "source_url": "https://proceedings.mlr.press/v235/cui24b.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/cui24b/cui24b.pdf", "source_kind": "official_proceedings", "id": "P061", "category": "04_生成模型与扩散机制", "pages": 13, "pdf_first_page_excerpt": "Learning Latent Space Hierarchical EBM Diffusion Models\nJiali Cui 1 Tian Han 1\nAbstract\nThis work studies the learning problem of the\nenergy-based prior model and the multi-layer gen-\nerator model. The multi-layer generator model,\nwhich contains multiple layers of latent variables\norganized in a top-down hierarchical structure,\ntypically assumes the Gaussian prior model. Such\na prior model can be limited in modelling expres-\nsivity, which results in a gap between the gener-\nator posterior and the prior model, known as the\nprior hole problem. Recent works have explored\nlearning the energy-based", "local_pdf": "references/04_生成模型与扩散机制/P061/paper.pdf", "sha256": "1e15d470beaf2d024086439746271c4f15d92d3669243601363a77a293131484", "bytes": 9745194, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "A Statistical Framework for Data-dependent Retrieval-Augmented Models", "venue": "ICML", "year": 2024, "source_url": "https://proceedings.mlr.press/v235/basu24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/basu24a/basu24a.pdf", "source_kind": "official_proceedings", "id": "P062", "category": "05_检索增强与知识系统", "pages": 27, "pdf_first_page_excerpt": "A Statistical Framework for Data-dependent Retrieval-Augmented Models\nSoumya Basu * 1 Ankit Singh Rawat * 2 Manzil Zaheer * 3\nAbstract\nModern ML systems increasingly augment input\ninstances with additional relevant information to\nenhance ﬁnal prediction. Despite growing interest\nin such retrieval-augmented models, their funda-\nmental properties and training are not well under-\nstood. We propose a statistical framework to study\nsuch models with two components: 1) a retriever\nto identify the relevant information out of a large\ncorpus via a data-dependent metric; and 2) a pre-\ndictor that consume", "local_pdf": "references/05_检索增强与知识系统/P062/paper.pdf", "sha256": "698e0591088e5aac70ac411707d36d1153e08ba6c73464f65b6dc130dc307693", "bytes": 537980, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "FuRL: Visual-Language Models as Fuzzy Rewards for Reinforcement Learning", "venue": "ICML", "year": 2024, "source_url": "https://proceedings.mlr.press/v235/fu24j.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/fu24j/fu24j.pdf", "source_kind": "official_proceedings", "id": "P063", "category": "06_多模态与跨模态融合", "pages": 19, "pdf_first_page_excerpt": "FuRL: Visual-Language Models as Fuzzy Rewards for Reinforcement Learning\nYuwei Fu 1 2 † Haichao Zhang 2 Di Wu 1 Wei Xu 2 Benoit Boulet 1\nAbstract\nIn this work, we investigate how to leverage pre-\ntrained visual-language models (VLM) for online\nReinforcement Learning (RL). In particular, we\nfocus on sparse reward tasks with pre-defined tex-\ntual task descriptions. We first identify the prob-\nlem of reward misalignment when applying VLM\nas a reward in RL tasks. To address this issue,\nwe introduce a lightweight fine-tuning method,\nnamed Fuzzy VLM reward-aided RL (FuRL),\nbased on reward alignment ", "local_pdf": "references/06_多模态与跨模态融合/P063/paper.pdf", "sha256": "c1077d6196ba410d055e121fb4050a09c427adac2e06e532fc690b37b54bd187", "bytes": 9931816, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "Contextualized Policy Recovery: Modeling and Interpreting Medical Decisions with Adaptive Imitation Learning", "venue": "ICML", "year": 2024, "source_url": "https://proceedings.mlr.press/v235/deuschel24a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v235/main/assets/deuschel24a/deuschel24a.pdf", "source_kind": "official_proceedings", "id": "P064", "category": "07_强化学习与智能体", "pages": 19, "pdf_first_page_excerpt": "Contextualized Policy Recovery: Modeling and Interpreting Medical Decisions\nwith Adaptive Imitation Learning\nJannik Deuschel * 1 2 Caleb N. Ellington * 1 Yingtao Luo 1 Benjamin J. Lengerich 3 4 Pascal Friederich 2\nEric P. Xing 5 1 6\nAbstract\nInterpretable policy learning seeks to estimate\nintelligible decision policies from observed ac-\ntions; however, existing models force a tradeoff\nbetween accuracy and interpretability, limiting\ndata-driven interpretations of human decision-\nmaking processes. Fundamentally, existing ap-\nproaches are burdened by this tradeoff because\nthey represent the under", "local_pdf": "references/07_强化学习与智能体/P0 ratory\nAbstract\nAngiography imaging is a medical imaging technique that\nenhances the visibility of blood vessels within the body by\nusing contrast agents. Angiographic images can effectively\nassist in the diagnosis of vascular diseases. However, con-\ntrast agents may bring extra radiation exposure which is\nharmful to patients with health risks.\nTo mitigate these\nconcerns, in this paper, we", "local_pdf": "references/02_Transformer与注意力/P122/paper.pdf", "sha256": "ab5c3fa72fef828cf064288db4a863df6e13cd3d974ec9c8a2626a9a8b802354", "bytes": 2928094, "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "copy_note": "原论文集/出版商公开版本"}, {"title": "DKDM: Data-Free Knowledge Distillation for Diffusion Models with Any Architecture", "venue": "CVPR", "year": 2025, "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Xiang_DKDM_Data-Free_Knowledge_Distillation_for_Diffusion_Models_with_Any_Architecture_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Xiang_DKDM_Data-Free_Knowledge_Distillation_for_Diffusion_Models_with_Any_Architecture_CVPR_2025_paper.pdf", "source_kind": "official_proceedings", "id": "P123", "download_status": "ok", "category": "04_生成模型与扩散机制", "pages": 11, "pdf_first_page_excerpt": "DKDM: Data-Free Knowledge Distillation for Diffusion Models with Any\nArchitecture\nQianlong Xiang1, Miao Zhang1,†, Yuzhang Shang2, Jianlong Wu1, Yan Yan3, Liqiang Nie1,†\n1Harbin Institute of Technology (Shenzhen) 2Illinois Institute of Technology 3University of Illinois Chicago\nhttps://github.com/qianlong0502/DKDM\nAbstract\nDiffusion models (DMs) have demonstrated exceptional\ngenerative capabilities across various domains, including\nimage, video, and so on. A key factor contributing to their\neffectiveness is the high quantity and quality of data used\nduring training. However, mainstream DMs now ", "local_pdf": "references/04_生成模型与扩散机制/P123/pa L", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/fan25f.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/fan25f/fan25f.pdf", "source_kind": "official_proceedings", "id": "P158", "category": "03_图神经网络与关系推理", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 25, "pdf_first_page_excerpt": "Learning Changes in Graphon Attachment Network Models\nXinyuan Fan 1 Bufan Li 1 Chenlei Leng 2 Weichi Wu 1\nAbstract\nThis paper introduces Graphon Attachment Net-\nwork Models (GAN-M), a novel framework for\nmodeling evolving networks with rich structural\ndependencies, grounded in graphon theory. GAN-\nM provides a flexible and interpretable founda-\ntion for studying network formation by leveraging\ngraphon functions to define attachment probabili-\nties, thereby combining the strengths of graphons\nwith a temporal perspective. A key contribution\nof this work is a methodology for learning struc-\ntural", "local_pdf": "references/03_图神经网络与关系推理/P158/paper.pdf", "sha256": "1992379ccaab4a9a05df659b351398d7c62f40578f3590ecbfa2eec669744f4e", "bytes": 646856, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "A Variational Framework for Improving Naturalness in Generative Spoken Language Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/chen25z.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/chen25z/chen25z.pdf", "source_kind": "official_proceedings", "id": "P159", "category": "04_生成模型与扩散机制", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 19, "pdf_first_page_excerpt": "A Variational Framework for Improving Naturalness\nin Generative Spoken Language Models\nLi-Wei Chen 1 Takuya Higuchi 2 Zakaria Aldeneh 2 Ahmed Hussen Abdelaziz 2 Alexander Rudnicky 1\nAbstract\nThe success of large language models in text pro-\ncessing has inspired their adaptation to speech\nmodeling. However, since speech is continuous\nand complex, it is often discretized for autore-\ngressive modeling. Speech tokens derived from\nself-supervised models (known as semantic to-\nkens) typically focus on the linguistic aspects of\nspeech but neglect prosodic information. As a\nresult, models trained on t", "local_pdf": "references/04_生成模型与扩散机制/P159/paper.pdf", "sha256": "6c6c734b0256dcf8bd73c61e66f4a9962ab64d2beed956f59610ae35ab5bb5de", "bytes": 861150, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "sciLaMA: A Single-Cell Representation Learning Framework to Leverage Prior Knowledge from Large Language Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/hu25aa.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/hu25aa/hu25aa.pdf", "source_kind": "official_proceedings", "id": "P160", "category": "11_因果与AI科学机制", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 19, "pdf_first_page_excerpt": "sciLaMA: A Single-Cell Representation Learning Framework to Leverage Prior\nKnowledge from Large Language Models\nHongru Hu 1 2 Shuwen Zhang 3 Yongin Choi 1 2 Venkat S. Malladi 4 Gerald Quon 1 2\nAbstract\nSingle-cell RNA sequencing (scRNA-seq) en-\nables high-resolution exploration of cellular di-\nversity and gene regulation, yet analyzing such\ndata remains challenging due to technical and\nmethodological limitations. Existing task-specific\ndeep generative models like Variational Auto-\nEncoder (VAE) and its variants struggle to in-\ncorporate external biological knowledge, while\ntransformer-based fo", "local_pdf": "references/05_检索增强与知识系统/P160/paper.pdf", "sha256": "f70bdf4780e32e84c56bf01fb7220d0cf579ef22850fd3f42cf7ea40e71a758d", "bytes": 8258294, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish.", "topic_review_note": "按论文主要方法主题人工修正自动关键词标签；原下载路径保留"}, {"title": "ELEMENTAL: Interactive Learning from Demonstrations and Vision-Language Models for Reward Design in Robotics", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/chen25at.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/chen25at/chen25at.pdf", "source_kind": "official_proceedings", "id": "P161", "category": "06_多模态与跨模态融合", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 26, "pdf_first_page_excerpt": "ELEMENTAL: Interactive Learning from Demonstrations and Vision-Language\nModels for Reward Design in Robotics\nLetian Chen 1 Nina Moorman 1 Matthew Gombolay 1\nAbstract\nReinforcement learning (RL) has demonstrated\ncompelling performance in robotic tasks, but its\nsuccess often hinges on the design of complex, ad\nhoc reward functions. Researchers have explored\nhow Large Language Models (LLMs) could en-\nable non-expert users to specify reward functions\nmore easily. However, LLMs struggle to balance\nthe importance of different features, generalize\npoorly to out-of-distribution robotic tasks, and\ncann", "local_pdf": "references/06_多模态与跨模态融合/P161/paper.pdf", "sha256": "870f6b7d388e0324c578f30fbc9df879b7cf5e40845213da3dd408fd161d5228", "bytes": 4048328, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "LMRL Gym: Benchmarks for Multi-Turn Reinforcement Learning with Language Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/abdulhai25a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/abdulhai25a/abdulhai25a.pdf", "source_kind": "official_proceedings", "id": "P162", "category": "07_强化学习与智能体", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 28, "pdf_first_page_excerpt": "LMRL Gym: Benchmarks for Multi-Turn Reinforcement Learning\nwith Language Models\nMarwa Abdulhai 1 Isadora White 1 Charlie Snell 1 Charles Sun 1\nJoey Hong 1 Yuexiang Zhai 1 Kelvin Xu 2 Sergey Levine 1\nAbstract\nLarge language models (LLMs) provide excellent\ntext-generation capabilities, but standard prompt-\ning and generation methods generally do not lead\nto intentional or goal-directed agents and might\nnecessitate considerable prompt tuning. Even the\nbest current LLMs rarely ask clarifying questions,\nengage in explicit information gathering, or take\nactions that lead to better decisions after mu", "local_pdf": "references/07_强化学习与智能体/P162/paper.pdf", "sha256": "d50cd618bb62c53c9453502d6027ab7f480c4aeea3e0df58306e4eeacbe7dd5d", "bytes": 764791, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "SHARP-Distill: A 68$\\times$ Faster Recommender System with Hypergraph Neural Networks and Language Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/forouzandeh25a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/forouzandeh25a/forouzandeh25a.pdf", "source_kind": "official_proceedings", "id": "P163", "category": "03_图神经网络与关系推理", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 37, "pdf_first_page_excerpt": "SHARP-Distill: A 68× Faster Recommender System with Hypergraph Neural\nNetworks and Language Models\nSaman Forouzandeh 1 Parham Moradi 1 Mahdi Jalili 1\nAbstract\nThis paper proposes SHARP-Distill (Speedy\nHypergraph And Review-based Personalised Dis-\ntillation), a novel knowledge distillation approach\nbased on the teacher-student framework that com-\nbines Hypergraph Neural Networks (HGNNs)\nwith language models to enhance recommenda-\ntion quality while significantly improving infer-\nence time. The teacher model leverages HGNNs\nto generate user and item embeddings from inter-\naction data, capturing ", "local_pdf": "references/03_图神经网络与关系推理/P163/paper.pdf", "sha256": "c0b0fc839d9e34e91c26f81c64ea5bd69ffe2e4b53ba59740ed2208cc723dbf7", "bytes": 2119956, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "Graph Neural Network Generalization With Gaussian Mixture Model Based Augmentation", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/abbahaddou25a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/abbahaddou25a/abbahaddou25a.pdf", "source_kind": "official_proceedings", "id": "P164", "category": "03_图神经网络与关系推理", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 24, "pdf_first_page_excerpt": "Graph Neural Network Generalization\nwith Gaussian Mixture Model Based Augmentation\nYassine Abbahaddou 1 * Fragkiskos D. Malliaros 2 Johannes F. Lutzeyer 1\nAmine M. Aboussalah 3 Michalis Vazirgiannis 1 4\nAbstract\nGraph Neural Networks (GNNs) have shown\ngreat promise in tasks like node and graph classi-\nfication, but they often struggle to generalize, par-\nticularly to unseen or out-of-distribution (OOD)\ndata.\nThese challenges are exacerbated when\ntraining data is limited in size or diversity. To\naddress these issues, we introduce a theoretical\nframework using Rademacher complexity to com-\npute ", "local_pdf": "references/03_图神经网络与关系推理/P164/paper.pdf", "sha256": "28d7101a7886bdcf615fc7358c8e184d6a2a2f362105c684f89c35f4707787c3", "bytes": 606987, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "Provable Benefits of Unsupervised Pre-training and Transfer Learning via Single-Index Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/jones-mccormick25a.html", "pdf_url": "htt
