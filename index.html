e interpretabil-\nity by identifying alternative inputs that produce\ndifferent outputs, offering localized insights into\nmodel decisions. However, traditional methods\noften neglect causal relationships, leading to un-\nrealistic examples. While newer approaches inte-\ngrate causality, they are computationally expen-\nsive. To address these challenges, we propose\nan effici", "local_pdf": "references/11_因果与AI科学机制/P166/paper.pdf", "sha256": "7a3ed77893b984bc0ac3db8417cbbdaf5483e714d6b94ff449837c7eb3ed98e0", "bytes": 368479, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "Open-Det: An Efficient Learning Framework for Open-Ended Detection", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/cao25h.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/cao25h/cao25h.pdf", "source_kind": "official_proceedings", "id": "P167", "category": "01_视觉网络与编码解码", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 21, "pdf_first_page_excerpt": "Open-Det: An Efficient Learning Framework for Open-Ended Detection\nGuiping Cao 1 2 Tao Wang 1 2 Wenjian Huang 1 Xiangyuan Lan 2 3 Jianguo Zhang 1 2 4 Dongmei Jiang 2\nAbstract\nOpen-Ended object Detection (OED) is a novel\nand challenging task that detects objects and gen-\nerates their category names in a free-form manner,\nwithout requiring additional vocabularies during\ninference. However, the existing OED models,\nsuch as GenerateU, require large-scale datasets\nfor training, suffer from slow convergence, and\nexhibit limited performance. To address these is-\nsues, we present a novel and efficient", "local_pdf": "references/01_视觉网络与编码解码/P167/paper.pdf", "sha256": "a9f0c839d2c6e0046e7ca9c8118c92dff9079d6098deb00095bdabe5794d096a", "bytes": 6342419, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "Quamba2: A Robust and Scalable Post-training Quantization Framework for Selective State Space Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/chiang25a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/chiang25a/chiang25a.pdf", "source_kind": "official_proceedings", "id": "P168", "category": "02_Transformer与注意力", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 17, "pdf_first_page_excerpt": "Quamba2: A Robust and Scalable Post-training Quantization Framework for\nSelective State Space Models\nHung-Yueh Chiang 1 Chi-Chih Chang 2 Natalia Frumkin 1\nKai-Chiang Wu 3 Mohamed S. Abdelfattah 2 Diana Marculescu 1\nAbstract\nDespite State Space Models (SSMs) are emerg-\ning as an efficient alternative to Transformers, de-\npolying SSMs on both cloud and edge devices is\nchallenging due to the limited resources. Model\nquantization reduces model size and leverages\nhardware acceleration, and recent efforts on SSM\nquantization have focused on optimizing a par-\nticular model or bit-width. However, dist", "local_pdf": "references/02_Transformer与注意力/P168/paper.pdf", "sha256": "35e16dbe1c8074956f94129133bbceea5ea348d923d126823aa66f6b10139a5e", "bytes": 6626256, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "AutoGFM: Automated Graph Foundation Model with Adaptive Architecture Customization", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/chen25bp.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/chen25bp/chen25bp.pdf", "source_kind": "official_proceedings", "id": "P169", "category": "03_图神经网络与关系推理", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 21, "pdf_first_page_excerpt": "AutoGFM: Automated Graph Foundation Model\nwith Adaptive Architecture Customization\nHaibo Chen 1 Xin Wang 1 Zeyang Zhang 1 Haoyang Li 1 Ling Feng 1 Wenwu Zhu 1\nAbstract\nGraph foundation models (GFMs) aim to share\ngraph knowledge across diverse domains and\ntasks to boost graph machine learning. However,\nexisting GFMs rely on hand-designed and fixed\ngraph neural network (GNN) architectures, failing\nto utilize optimal architectures w.r.t. specific do-\nmains and tasks, inevitably leading to suboptimal\nperformance in diverse graph domains and tasks.\nIn this paper, we explore graph neural architectur", "local_pdf": "references/03_图神经网络与关系推理/P169/paper.pdf", "sha256": "afced291f642bbbdadcea7c813bf8a3090b9011eeb93010b90833f6c1cff7d10", "bytes": 714063, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "InfoSEM: A Deep Generative Model with Informative Priors for Gene Regulatory Network Inference", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/cui25e.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/cui25e/cui25e.pdf", "source_kind": "official_proceedings", "id": "P170", "category": "04_生成模型与扩散机制", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 16, "pdf_first_page_excerpt": "InfoSEM: A Deep Generative Model with Informative Priors for Gene\nRegulatory Network Inference\nTianyu Cui 1 Song-Jun Xu 1 Artem Moskalev 1 Shuwei Li 1 Tommaso Mansi 1 Mangal Prakash 1 * Rui Liao 1 *\nAbstract\nInferring Gene Regulatory Networks (GRNs)\nfrom gene expression data is crucial for under-\nstanding biological processes. While supervised\nmodels are reported to achieve high performance\nfor this task, they rely on costly ground truth\n(GT) labels and risk learning gene-specific bi-\nases—such as class imbalances of GT interac-\ntions—rather than true regulatory mechanisms.\nTo address these is", "local_pdf": "references/04_生成模型与扩散机制/P170/paper.pdf", "sha256": "703b195d8c236755a2b7b909265176bb09cdb8eb2512a0b152a625c83cbd528c", "bytes": 536256, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "From RAG to Memory: Non-Parametric Continual Learning for Large Language Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/gutierrez25a.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/gutierrez25a/gutierrez25a.pdf", "source_kind": "official_proceedings", "id": "P171", "category": "05_检索增强与知识系统", "copy_note": "官方会议公开论文版本", "batch": "v2-2025-expansion", "pages": 19, "pdf_first_page_excerpt": "From RAG to Memory: Non-Parametric Continual Learning for\nLarge Language Models\nBernal Jim´enez Guti´errez * 1 Yiheng Shu * 1 Weijian Qi 1 Sizhe Zhou 2 Yu Su 1\nAbstract\nOur ability to continuously acquire, organize, and\nleverage knowledge is a key feature of human\nintelligence that AI systems must approximate\nto unlock their full potential. Given the chal-\nlenges in continual learning with large language\nmodels (LLMs), retrieval-augmented generation\n(RAG) has become the dominant way to intro-\nduce new information. However, its reliance on\nvector retrieval hinders its ability to mimic the dy-\nn", "local_pdf": "references/05_检索增强与知识系统/P171/paper.pdf", "sha256": "45ce410cc2656736fb3f6a18eb34cf8d742fcb46a05a02fa02b60b0d10907f3e", "bytes": 2409304, "download_status": "ok", "collected_date": "2026-10-01", "license": "See original source; publicly accessible does not imply permission to republish."}, {"title": "FOCoOp: Enhancing Out-of-Distribution Robustness in Federated Prompt Learning for Vision-Language Models", "venue": "ICML", "year": 2025, "source_url": "https://proceedings.mlr.press/v267/liao25e.html", "pdf_url": "https://raw.githubusercontent.com/mlresearch/v267/main/assets/liao25e/liao25e.pdf", "source_kind": "official_proceedings", "
