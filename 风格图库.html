alable_3D_Anomaly_Detection_and_Localization_A_Benchmark_via_CVPR_2024_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Pipeline for anomaly synthesis built upon the Anomaly-ShapeNet Dataset. Selected normal samples are pro- cessed through a mesh subdivision module to attain a more uni- form point cloud distribution. We employ Blender to introduce defects into the refined samples, and utilize CloudCompare soft- ware to acquire 3D anomaly ground truth.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "08", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/08_训练策略与自监督/P007/figures/P007_F2_p03.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "0d5d1ac839a974dea8cff22714c3cdeffdcd8192df0119d571bbf909b2c2fb0f"}, {"id": "P007_F3_p04", "title": "Towards Scalable 3D Anomaly Detection and Localization: A Benchmark via 3D Anomaly Synthesis and A Self-Supervised Learning Network", "category": "08_训练策略与自监督", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Li_Towards_Scalable_3D_Anomaly_Detection_and_Localization_A_Benchmark_via_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Li_Towards_Scalable_3D_Anomaly_Detection_and_Localization_A_Benchmark_via_CVPR_2024_paper.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3. Overview of the Iterative Mask Reconstruction Network (IMRNet) Pipeline. (a) Training Phase: The standard training point cloud is initially converted to point-patch format using the Geometry-aware Point-cloud Sampling (GPS) module. Following this, random masking is applied to the point-patches, which are then reconstructed by a network comprising an Autoencoder-based Transformer and a lightweight prediction head, operating in a self-supervised paradigm. (b) Testing Phase: The input point cloud is subjected to a reconstruction process mirroring the training procedure. The reconstructed point cloud is cyclically fed back into the reconstruction network as input for several iterations. Ultimately, a comparative analysis is performed between the reconstructed and the original point clouds at both the point cloud and feature levels to derive the final anomaly score map.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "08", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/08_训练策略与自监督/P007/figures/P007_F3_p04.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "86b88fb48d8149827cbeed505bfe43619f5e9e4b34e8e26a23d973d74f6818d7"}, {"id": "P008_F1_p01", "title": "VoCo: A Simple-yet-Effective Volume Contrastive Learning Framework for 3D Medical Image Analysis", "category": "08_训练策略与自监督", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.pdf", "figure_number": "1", "pdf_page": 1, "caption": "Figure 1. (a) In 3D medical images, the contextual positions, i.e., the geometric relations between different organs are relatively con- sistent. (b) Aiming to leverage contextual position priors for pre- training, we proposed a Volume Contrast (VoCo) framework for 3D Medical Image Analysis.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "08", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/08_训练策略与自监督/P008/figures/P008_F1_p01.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "d922f93f82134a0fc19d94e95ba6ee77a5135e13f06b2476a3034a89b49e0f54"}, {"id": "P008_F2_p02", "title": "VoCo: A Simple-yet-Effective Volume Contrastive Learning Framework for 3D Medical Image Analysis", "category": "08_训练策略与自监督", "layout_style": "L09", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.pdf", "figure_number": "2", "pdf_page": 2, "caption": "Figure 2. Typical contrastive learning frameworks. (a) Instance-level contrastive learning [10, 11, 29, 22, 7] employs strong data augmentation or model perturbation on input data to acquire different views of instance, then regularizes their consistency. (b) Prototype- level contrastive learning [5, 6, 56, 45, 15, 16] conducts (1) online clustering or (2) randomly initialize then online update process to obtain prototypes as class assignments, then leverage the prototypes to contrast each input image. (c) Our VoCo follows the idea of prototype-level contrastive learning. Specifically, instead of using time-consuming online clustering and updating procedures, we leverage the valuable contextual position priors of 3D medical images and leverage the base crops to generate prototypes (bases).", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "08", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/08_训练策略与自监督/P008/figures/P008_F2_p02.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "9a05dc3deb8769d0a925480ddec48dddc8efbd7a8e2ce108b5cf17f7f20b4752"}, {"id": "P008_F3_p04", "title": "VoCo: A Simple-yet-Effective Volume Contrastive Learning Framework for 3D Medical Image Analysis", "category": "08_训练策略与自监督", "layout_style": "L04", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Wu_VoCo_A_Simple-yet-Effective_Volume_Contrastive_Learning_Framework_for_3D_Medical_CVPR_2024_paper.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3. The overall framework of VoCo. VoCo contains a prediction branch and a regularization branch. The prediction branch is responsible for predicting contextual positions between different sub-volumes. The regularization branch is employed to enforce the feature discrepancy between different bases, which aims to learn more discriminative class assignments.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "08", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/08_训练策略与自监督/P008/figures/P008_F3_p04.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "41a2191ab5e14667d74fa2ef5b1084d3812af88cc4e56f99c5b9d3b1c812b93f"}, {"id": "P009_F2_p04", "title": "Querying as Prompt: Parameter-Efficient Learning for Multimodal Language Model", "category": "06_多模态与跨模态融合", "layout_style": "L04", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Liang_Querying_as_Prompt_Parameter-Efficient_Learning_for_Multimodal_Language_Model_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Liang_Querying_as_Prompt_Parameter-Efficient_Learning_for_Multimodal_Language_Model_CVPR_2024_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Illustration of our Querying as Prompt method in the pre-trained Language Model. The Learnable Querying Prompts, along with text embedding, are jointly input into the language model. Text information is integrated into the Querying Prompt through the frozen self-attention layer, resulting in a Text-conditioned Querying Prompt. Subsequently, the Text-conditioned Querying Prompt interacts with multimodal embeddings through the Text-conditioned Resampler module, facilitating Modality Adaptation. After obtaining text-relevant multimodal information, it undergoes Domain Adaptation by combining with text embedding through a FFN layer and an Adapter layer.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "06", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/06_多模态与跨模态融合/P009/figures/P009_F2_p04.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "2283b207e201d496426cdab1780c9317b27b4d968e92aac93bfa9d8315d6c96b"}, {"id": "P010_F1_p03", "title": "Clustering for Protein Representation Learning", "category": "11_因果与AI科学机制", "layout_style": "L05", "visual_style": "V05", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Quan_Clustering_for_Protein_Representation_Learning_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Quan_Clustering_for_Protein_Representation_Learning_CVPR_2024_paper.pdf", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1. Overview of our iterative neural clustering pipeline for protein representation learning: (a) input protein with amino acids, (b) iterative clustering algorithm which repeatedly stacks three steps ⟳(4⇤5), (c) output can be seen as the critical amino acids of the protein, (d) output amino acids used for classiﬁcation. The details of our iterative neural clustering method can be seen in §3.2.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/11_因果与AI科学机制/P010/figures/P010_F1_p03.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "b09962198f526c51c34e14d074baadbce2b9130817d12783165fff55365e7185"}, {"id": "P010_F2_p04", "title": "Clustering for Protein Representation Learning", "category": "11_因果与AI科学机制", "layout_style": "L03", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Quan_Clustering_for_Protein_Representation_Learning_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Quan_Clustering_for_Protein_Representation_Learning_CVPR_2024_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Our neural clustering framework architecture with four iterations. Given a protein, a set of 1D and 3D amino acids, our method adopts an iterative clustering algorithm to explore the most representative amino acids. At each iteration, B cluster representation extraction blocks are utilized to extract cluster features. The clustering nomination operation selects the fraction ! of amino acids for the next iteration, that Nt =b! · Nt−1c. Details of the framework can be seen in §3.3.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/11_因果与AI科学机制/P010/figures/P010_F2_p04.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "2405ed2ece0c84987d10f5c363fb82e959392c9fe0851923dbf8b7da7b9ef374"}, {"id": "P011_F1_p03", "title": "Convolutional Prompting meets Language Models for Continual Learning", "category": "01_视觉网络与编码解码", "layout_style": "L04", "visual_style": "V02", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Roy_Convolutional_Prompting_meets_Language_Models_for_Continual_Learning_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Roy_Convolutional_Prompting_meets_Language_Models_for_Continual_Learning_CVPR_2024_paper.pdf", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1. The proposed ConvPrompt architecture. The layerwise [cls] embedding is passed through the projection network to generate task-specific query representations which are then matched with the prompt-keys using cosine similarity to get the similarity values of prompt-generators. The prompt generators are applied over the shared embeddings to generate input specific prompt components. A weighted average of these prompt components are calculated with the corresponding cosine similarity value as weights to get the input specific key and value prompts which are applied to the pre-trained model. The learnable components are highlighted in green, the frozen components are highlighted in grey.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "01", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/01_视觉网络与编码解码/P011/figures/P011_F1_p03.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "324a00dfd71c310fd225cb30d719236fb240f47ab7c00ba894ffe2a740cd625e"}, {"id": "P012_F1_p04", "title": "OmniVec2 - A Novel Transformer based Network for Large Scale Multimodal and Multitask Learning", "category": "02_Transformer与注意力", "layout_style": "L02", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Srivastava_OmniVec2_-_A_Novel_Transformer_based_Network_for_Large_Scale_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Srivastava_OmniVec2_-_A_Novel_Transformer_based_Network_for_Large_Scale_CVPR_2024_paper.pdf", "figure_number": "1", "pdf_page": 4, "caption": "Figure 1. Overview of the proposed method. The proposed method consists of three parts, the feature transformation network f(·) which consists of a transformer followed by fully connected layers to reduce feature dimensions, another transformer g(·) and finally the task prediction heads hmt(·) for task t on modality m. The input data is tokenized with corresponding modality specific tokenizer. While training, pairs of modalities are used and the features are fused between the two modalities using cross attention layers, in a two stream configuration as shown here. While making prediction, the network is a single stream with cross attention layers removed, and the output is hmt ◦g ◦f(x) where x is the output of the corresponding modality specific tokenizer.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/02_Transformer与注意力/P012/figures/P012_F1_p04.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "70cce5fe683a58e077b4c1e4f12fbba7a2bc44f0c677f24feaff65cfcd51bdf6"}, {"id": "P013_F1_p02", "title": "LLM4SGG: Large Language Models for Weakly Supervised Scene Graph Generation", "category": "03_图神经网络与关系推理", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Kim_LLM4SGG_Large_Language_Models_for_Weakly_Supervised_Scene_Graph_Generation_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Kim_LLM4SGG_Large_Language_Models_for_Weakly_Supervised_Scene_Graph_Generation_CVPR_2024_paper.pdf", "figure_number": "1", "pdf_page": 2, "caption": "Figure 1. (a) The pipeline of weakly-supervised SGG. (b) The predicate distribution of unlocalized triplets (Parser+KB vs. Ours). In Parser+KB, the distribution becomes heavily long-tailed, and 12 out of 50 predicates are non-existent. (c) Semantic over-simpliﬁcation caused by a rule-based parser in Step 2. (d) Low-density scene graph caused by the static structure of KB in Step 3.", "crop_note": "右侧方法结构，剔除左侧词频柱图", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/03_图神经网络与关系推理/P013/figures/P013_F1_p02.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "0d2371a647e377a0d1e403aff3f0361fda0408a7f4379059e6a5a05e26b633b7"}, {"id": "P013_F2_p05", "title": "LLM4SGG: Large Language Models for Weakly Supervised Scene Graph Generation", "category": "03_图神经网络与关系推理", "layout_style": "L04", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Kim_LLM4SGG_Large_Language_Models_for_Weakly_Supervised_Scene_Graph_Generation_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Kim_LLM4SGG_Large_Language_Models_for_Weakly_Supervised_Scene_Graph_Generation_CVPR_2024_paper.pdf", "figure_number": "2", "pdf_page": 5, "caption": "Figure 2. The pipeline of LLM4SGG. Given an image with its caption, we use an LLM to extract triplets from the original caption (Step 2-1) and the paraphrased caption (Step 2-2). Then, we align the entity/predicate classes within the extracted triplets with semantically similar lexeme in the target data via an LLM (Step 3), obtaining the unlocalized triplets. Lastly, we ground the unlocalized triplets over image regions (Step 4) followed by the training of an SGG model.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/03_图神经网络与关系推理/P013/figures/P013_F2_p05.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "c1364b6dd7cf61930f739d36feeb228b3bd140829c1a6d8470e8bb819df4e0e6"}, {"id": "P014_F1_p04", "title": "SNED: Superposition Network Architecture Search for Efficient Video Diffusion Model", "category": "04_生成模型与扩散机制", "layout_style": "L02", "visual_style": "V05", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Li_SNED_Superposition_Network_Architecture_Search_for_Efficient_Video_Diffusion_Model_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Li_SNED_Superposition_Network_Architecture_Search_for_Efficient_Video_Diffusion_Model_CVPR_2024_paper.pdf", "figure_number": "1", "pdf_page": 4, "caption": "Figure 1. Overview of SNED framework. (a) We train a supernet with network dynamic cost sampling and multiple input resolution options. In each iteration, a subnet of the supernet is sampled for the training, and other parts (grey) is frozen. (b) After the training, we obtain subnets with different model costs for each resolution option.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "04", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/04_生成模型与扩散机制/P014/figures/P014_F1_p04.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "c725ad5bc3b7a76b9332fb379367ab42eb2749d90b2df413903e54376c691e97"}, {"id": "P014_F2_p04", "title": "SNED: Superposition Network Architecture Search for Efficient Video Diffusion Model", "category": "04_生成模型与扩散机制", "layout_style": "L06", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Li_SNED_Superposition_Network_Architecture_Search_for_Efficient_Video_Diffusion_Model_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Li_SNED_Superposition_Network_Architecture_Search_for_Efficient_Video_Diffusion_Model_CVPR_2024_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Dynamic cost scheme for SNED framework.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "04", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/04_生成模型与扩散机制/P014/figures/P014_F2_p04.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "b767107338724524dc6fdc63cc76520768c2f237df1ace1a93a9ae427f564afc"}, {"id": "P015_F2_p02", "title": "Leveraging Predicate and Triplet Learning for Scene Graph Generation", "category": "03_图神经网络与关系推理", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Li_Leveraging_Predicate_and_Triplet_Learning_for_Scene_Graph_Generation_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Li_Leveraging_Predicate_and_Triplet_Learning_for_Scene_Graph_Generation_CVPR_2024_paper.pdf", "figure_number": "2", "pdf_page": 2, "caption": "Figure 2. Comparison of different pipelines for relation recog- nition. Previous methods focus on learning predicate cues shared across various triplets with diverse visual appearance. Our method learns and leverages both triplet cues within the same triplet and predicate cues across triplets, to better handle the visual diversity.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/03_图神经网络与关系推理/P015/figures/P015_F2_p02.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "de436e529060fb45245c4b14130aa3c4bef05e235c570a2f29570a850b50ef2a"}, {"id": "P015_F3_p03", "title": "Leveraging Predicate and Triplet Learning for Scene Graph Generation", "category": "03_图神经网络与关系推理", "layout_style": "L04", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2024/html/Li_Leveraging_Predicate_and_Triplet_Learning_for_Scene_Graph_Generation_CVPR_2024_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2024/papers/Li_Leveraging_Predicate_and_Triplet_Learning_for_Scene_Graph_Generation_CVPR_2024_paper.pdf", "figure_number": "3", "pdf_page": 3, "caption": "Figure 3. Illustration of the proposed Dual-granularity Relation Modeling (DRM) network. The learning procedure of DRM is composed of two stages. In the first stage, we capture the coarse-grained predicate cues shared across different subject-object pairs and learn the fine-grained triplet cues under specific subject-object pairs. In the second stage, the Dual-granularity Knowledge Transfer (DKT) strategy transfers the variation from head predicates with their associate triplets to the tail. Then DRM exploits the real instances along with synthetic samples from the calibrated tail distribution to fine-tune the relation classifier, which alleviates the long-tail problem in SGG.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2024, "venue": "CVPR", "image": "references/03_图神经网络与关系推理/P015/figures/P015_F3_p03.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "364f157f6037831bbe7e609d4b82a3db6ff1ce0476535f363818c75e3b88adce"}, {"id": "P017_F2_p03", "title": "GameFormer: Game-theoretic Modeling and Learning of Transformer-based Interactive Prediction and Planning for Autonomous Driving", "category": "02_Transformer与注意力", "layout_style": "L02", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Huang_GameFormer_Game-theoretic_Modeling_and_Learning_of_Transformer-based_Interactive_Prediction_and_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Huang_GameFormer_Game-theoretic_Modeling_and_Learning_of_Transformer-based_Interactive_Prediction_and_ICCV_2023_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Overview of our proposed GameFormer framework. The scene context encoding is obtained via a Transformer-based encoder; the level-0 decoder takes the modality embedding and agent history encodings as query and outputs level-0 future trajectories and scores; the level-k decoder uses a self-attention module to model the level-(k −1) future interaction and append it to the scene context encoding.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2023, "venue": "ICCV", "image": "references/02_Transformer与注意力/P017/figures/P017_F2_p03.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "bedff62cac09cfd3f8465a9a569ccd70607039656d1c8749febcf8bd4fba5beb"}, {"id": "P017_F3_p04", "title": "GameFormer: Game-theoretic Modeling and Learning of Transformer-based Interactive Prediction and Planning for Autonomous Driving", "category": "02_Transformer与注意力", "layout_style": "L07", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Huang_GameFormer_Game-theoretic_Modeling_and_Learning_of_Transformer-based_Interactive_Prediction_and_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Huang_GameFormer_Game-theoretic_Modeling_and_Learning_of_Transformer-based_Interactive_Prediction_and_ICCV_2023_paper.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3. The detailed structure of a level-k interaction decoder.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2023, "venue": "ICCV", "image": "references/02_Transformer与注意力/P017/figures/P017_F3_p04.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "92352e32d79c79e6a11582919701d74f67999a9c01d676cfc19ad7ab8337e0c9"}, {"id": "P019_F4_p05", "title": "Text-Conditioned Sampling Framework for Text-to-Image Generation with Masked Generative Models", "category": "04_生成模型与扩散机制", "layout_style": "L04", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Lee_Text-Conditioned_Sampling_Framework_for_Text-to-Image_Generation_with_Masked_Generative_Models_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Lee_Text-Conditioned_Sampling_Framework_for_Text-to-Image_Generation_with_Masked_Generative_Models_ICCV_2023_paper.pdf", "figure_number": "4", "pdf_page": 5, "caption": "Figure 4: Overall generation framework of proposed TCTS and FAS. After the generator predicts the tokens, TCTS exploits the text condition to detect misaligned tokens and outputs the score map. Meanwhile, FAS splits the tokens according to the frequency using the self-attention map from the generator, performing revocable sampling to high-frequency split and persistent sampling to low-frequency split. The adaptive sampling predicts ˆx0 and decide a few of the locations to mask according to xt. The token maps produced by FAS is combined with the score map to predict xt−1. After iterative process, our model removes all the masks and generates x0.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "04", "kind": "paper_reference", "year": 2023, "venue": "ICCV", "image": "references/04_生成模型与扩散机制/P019/figures/P019_F4_p05.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "cdaf8e015856910a41ae743325d7c243d3f6b2661c29de4665a765f2f86e5199"}, {"id": "P020_F1_p03", "title": "Learning Spatial-context-aware Global Visual Feature Representation for Instance Image Retrieval", "category": "05_检索增强与知识系统", "layout_style": "L04", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Zhang_Learning_Spatial-context-aware_Global_Visual_Feature_Representation_for_Instance_Image_Retrieval_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Zhang_Learning_Spatial-context-aware_Global_Visual_Feature_Representation_for_Instance_Image_Retrieval_ICCV_2023_paper.pdf", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1. Overview of our framework. After an initial feature extraction by a CNN backbone, two branches of “Visual Feature Branch” and “Spatial Context Branch” are used to extract visual and spatial context information. After that, a cross-attention module is used to fuse the visual feature and the corresponding spatial context feature to generate spatial-context-aware visual representations for images. In particular, “GMM” denotes the Gaussian Mixture Model process, and “GP+W” refers to global pooling followed by whitening.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "05", "kind": "paper_reference", "year": 2023, "venue": "ICCV", "image": "references/05_检索增强与知识系统/P020/figures/P020_F1_p03.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "6d9c28e8e9e8550ed49f94c5828a559d3d7792c46150b10cc89338d732844bca"}, {"id": "P021_F2_p04", "title": "Preventing Zero-Shot Transfer Degradation in Continual Learning of Vision-Language Models", "category": "06_多模态与跨模态融合", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Zheng_Preventing_Zero-Shot_Transfer_Degradation_in_Continual_Learning_of_Vision-Language_Models_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Zheng_Preventing_Zero-Shot_Transfer_Degradation_in_Continual_Learning_of_Vision-Language_Models_ICCV_2023_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Illustration of ZSCL in feature space. Fig. 3(a) shows the pipeline of distillation. The original and the current model encode the reference images and texts, respectively. The probability distribution of images and texts with respect to each other is distilled. Fig. 3(b) displays how distillation loss preserves the feature space. Compared with the reference dataset, the features of fine-tuning tasks lie in a small subspace. The distillation loss preserves the structure of the feature space by maintaining relative distances.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "06", "kind": "paper_reference", "year": 2023, "venue": "ICCV", "image": "references/06_多模态与跨模态融合/P021/figures/P021_F2_p04.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "31974a36615723fc40c35a230ce73ef8333acc13b840a08062c47b212a03941d"}, {"id": "P022_F2_p03", "title": "Scene Graph Contrastive Learning for Embodied Navigation", "category": "03_图神经网络与关系推理", "layout_style": "L05", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2: Iterative Graph Building. Illustrative example of how a scene graph is built. The agent, the room, and the objects are all added as nodes to the graph. As the agent moves in the environment, we add the objects that it sees, for instance at t=3, the coffee machine, sink, and counter- top. We also add edges that signify various relationships like Contains, On, and Sees.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2023, "venue": "ICCV", "image": "references/03_图神经网络与关系推理/P022/figures/P022_F2_p03.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "d8df837c875de220f88adc9098c8df9782939c8f78b48d7217f5cf1c0d857fa7"}, {"id": "P022_F3_p04", "title": "Scene Graph Contrastive Learning for Embodied Navigation", "category": "03_图神经网络与关系推理", "layout_style": "L09", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Singh_Scene_Graph_Contrastive_Learning_for_Embodied_Navigation_ICCV_2023_paper.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3: Scene Graph Contrastive (SGC) framework. We show a standard Embodied-AI model which takes, as input, an egocentric RGB observation and outputs a policy and scalar value for RL training. We supplement this with our Scene Graph Contrastive Model. It takes as input, the belief, bt, and graph representation gt, at each time step. The prediction of this model, pt is passed into the Scene Graph Contrastive Loss. The SGC Loss optimizes the model to predict which graph embedding belongs to a particular time step, t.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2023, "venue": "ICCV", "image": "references/03_图神经网络与关系推理/P022/figures/P022_F3_p04.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "63c010fe7357159844df84e9e19ecb4d14e8fb48ab4703a17afa376e60658cb2"}, {"id": "P023_F2_p04", "title": "Multiple Instance Learning Framework with Masked Hard Instance Mining for Whole Slide Image Classification", "category": "08_训练策略与自监督", "layout_style": "L09", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/ICCV2023/html/Tang_Multiple_Instance_Learning_Framework_with_Masked_Hard_Instance_Mining_for_ICCV_2023_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2023/papers/Tang_Multiple_Instance_Learning_Framework_with_Masked_Hard_Instance_Mining_for_ICCV_2023_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2: Overview of proposed MHIM-MIL. A momentum teacher is used to compute attention scores for all instances. We mask instances based on attention with hard mining strategies and feed the remaining to the student model. The student is updated by a consistency loss term Lcon and a label error loss term Lcls. The teacher parameters are updated with an Exponential Moving Average (EMA) of the student parameters without gradient updates. In the inference phase, we use pired_Latent_Variable_Model_for_Interpreting_Graph_Neural_CVPR_2022_paper.pdf", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1. Illustration of OrphicX. We instantiate our explainer with a variational graph auto-encoder (VGAE), which consists of an inference network and a generative network. The causal features along with the spurious features can be used to reconstruct the graph structure within the data distribution, while the causal features are mapped to a graph-structured mask for the causal explanation. The target GNN is pre-trained, and the parameters would not be changed during the training of OrphicX.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2022, "venue": "CVPR", "image": "references/03_图神经网络与关系推理/P030/figures/P030_F1_p03.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "f742a65b4d6e065dcad17cef14f814de9329d5236850195fd0f6476d4a7f1548"}, {"id": "P030_F2_p03", "title": "OrphicX: A Causality-Inspired Latent Variable Model for Interpreting Graph Neural Networks", "category": "03_图神经网络与关系推理", "layout_style": "L05", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/CVPR2022/html/Lin_OrphicX_A_Causality-Inspired_Latent_Variable_Model_for_Interpreting_Graph_Neural_CVPR_2022_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2022/papers/Lin_OrphicX_A_Causality-Inspired_Latent_Variable_Model_for_Interpreting_Graph_Neural_CVPR_2022_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Illustration of the causal graph. The causal features are a set of factors in the latent space. The causal features and the spurious features together form the representation of the input graph. The graph structure is reconstructed based on the latent representation; it forms the input of 2: Overview of our proposed framework, FedCola. In each round of FL, uni- modal clients download the global model for their modality along with the transformer blocks from the other modalities and perform complementary local training to address the cross-modality gap, while multi-modal clients perform standard multi-modal local training. Then, all clients send their local updates to the server for uni-aggregation and collaborative aggregation to address the in-modality gap.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2024, "venue": "ECCV", "image": "references/02_Transformer与注意力/P037/figures/P037_F2_p06.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "c85332760f03378aa3108df71866d4488108dac48862022964a2ed0b442e1ba6"}, {"id": "P037_F3_p07", "title": "Towards Multi-modal Transformers in Federated Learning", "category": "02_Transformer与注意力", "layout_style": "L09", "visual_style": "V01", "source_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/2339_ECCV_2024_paper.php", "pdf_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/02339.pdf", "figure_number": "3", "pdf_page": 7, "caption": "Fig. 3: Illustration of the self-attention (Attention) and other layers updates with and without the proposed compensation scheme. The width of the block indicates the aggre- gation coefficient on that client. Without the compensation, layer-level misalignment happens between self-attention and other layers, while modality-level misalignment happens between updates of each modality on multi-modal updates. With compensa- tion, both misalignment is fixed.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2024, "venue": "ECCV", "image": "references/02_Transformer与注意力/P037/figures/P037_F3_p07.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "b7212c0a292508f71b95bd8b789fc5c280c451866c10e77b06f4317101559b52"}, {"id": "P038_F2_p05", "title": "Equi-GSPR: Equivariant SE(3) Graph Network Model for Sparse Point Cloud Registration", "category": "03_图神经网络与关系推理", "layout_style": "L02", "visual_style": "V03", "source_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/521_ECCV_2024_paper.php", "pdf_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/00521.pdf", "figure_number": "2", "pdf_page": 5, "caption": "Fig. 2: The registration model consists of an encoder, a feature match block, and a decoder. Pointwise feature descriptors are extracted from the source and target scan points, passed through equivariant graph layers, and combined with coordinate embed- dings to form a row-major order matrix. Next, the feature matrices from the source and target frames are compressed using MLPs-based Low-Rank Feature Transforma- tion (LRFT). The aggregated features are used to create a similarity map through dot product of feature descriptors. In the decoder, features are weighted by similarity scores, then concatenated, and processed through pooling and fully connected layers to predict relative translation ti", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2024, "venue": "ECCV", "image": "references/03_图神经网络与关系推理/P038/figures/P038_F2_p05.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "74a6466e99c9d6672e3064f473200722cb19ff126095afb2109e092d2d08b939"}, {"id": "P039_F2_p03", "title": "VFusion3D: Learning Scalable 3D Generative Models from Video Diffusion Mode  two-step strategy to train our proposed network. (e) During inference, we calculate cosine similarity to find the adjacent fragment pairs and further process the matching similarity matrix to establish better correspondences between a fragment pair.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "05", "kind": "paper_reference", "year": 2024, "venue": "ECCV", "image": "references/05_检索增强与知识系统/P040/figures/P040_F2_p04.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "c0ab8389804083580de725fd2e732a1b566a04823a16132eb21825edcea7a832"}, {"id": "P041_F2_p06", "title": "UniCode : Learning a Unified Codebook for Multimodal Large Language Models", "category": "06_多模态与跨模态融合", "layout_style": "L09", "visual_style": "V01", "source_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/1331_ECCV_2024_paper.php", "pdf_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/01331.pdf", "figure_number": "2", "pdf_page": 6, "caption": "Fig. 2: Illustration of multiple paradigms to obtain a unified codebook. The dotted line indicates the training loop: (a) frozen LLM codebook, which initiates the codebook with a pretrained LLM and freezes it during training; (b) dual alternative training, which jointly trains both the visual tokenizer and the LLM by alternatively updating each one’s codebook using the other’s parameters; (c) language-driven iterative training, which smoothly updates the codebook of the visual tokenizer with the LLM’s through a moving average manner.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "06", "kind": "paper_reference", "year": 2024, "venue": "ECCV", "image": "references/06_多模态与跨模态融合/P041/figures/P041_F2_p06.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", 24, "venue": "ECCV", "image": "references/08_训练策略与自监督/P043/figures/P043_F2_p05.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "0b298ec25fcba6264ee66d87ec6cce9b2ca3b0632ef023d5e19fa45f54ff34b7"}, {"id": "P044_F2_p05", "title": "OccWorld: Learning a 3D Occupancy World Model for Autonomous Driving", "category": "09_三维视觉与神经渲染", "layout_style": "L07", "visual_style": "V03", "source_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/2024_ECCV_2024_paper.php", "pdf_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/02024.pdf", "figure_number": "2", "pdf_page": 5, "caption": "Fig. 2: Framework of our OccWorld for 4D semantic occupancy forecasting and motion planning. We adopt a GPT-like generative architecture to predict the next scene from previous scenes in an autoregressive manner. We adapt GPT [2] to the autonomous driving scenario with two key designs: 1) We train a 3D occupancy scene tokenizer to produce discrete high-level representations of the 3D scene; 2) We perform spatial mixing before and after spatial-wise temporal causal self-attention to efficiently produce globally consistent scene predictions. We use ground-truth and predicted scene tokens as inputs for future generations for training and inference, respectively.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "09", "kind": "paper_reference", "year": 2024, "venue": "ECCV", "image": "references/09_三维视觉与神经渲染/P044/figures/P044_F2_p05.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "73dcef110c58a074847ae99299a52112bfca37aefa2f97115f329571ee9c45b6"}, {"id": "P044_F3_p07", "title": "OccWorld: Learning a 3D Occupancy World Model for Autonomous Driving", "category": "09_三维视觉与神经渲染", "layout_style": "L09", "visual_style": "V03", "source_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/2024_ECCV_2024_paper.php", "pdf_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/02024.pdf", "figure_number": "3", "pdf_page": 7, "caption": "Fig. 3: Illustration of the proposed modules. (a) We use CNNs to encode the 3D occupancy and perform vector quantization to obtain discrete tokens using a learnable codebook [42]. We then employ a decoder to reconstruct the input 3D occupancy us- ing the quantized tokens and train the autoencoder and codebook simultaneously. (b) As each scene is represented by world tokens, we adopt spatial mixing to model their intrinsic dependencies and obtain multi-scale world tokens to capture multi-level infor- mation. We perform spatial-wise temporal causal self-attention at each level to forecast the next scene and employ a U-net structure to aggregate multi-scale predictions.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "09", "kind": "paper_reference", "year": 2024, "venue": "ECCV", "image": "references/09_三维视觉与神经渲染/P044/figures/P044_F3_p07.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "a2e9fa327a69010a12629a452f2d0dbf5f1f46a8651869e2ac7bd72784a7faa8"}, {"id": "P045_F2_p04", "title": "Resilience of Entropy Model in Distributed Neural Networks", "category": "10_计算机系统与数据流程", "layout_style": "L09", "visual_style": "V01", "source_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/html/3193_ECCV_2024_paper.php", "pdf_url": "https://www.ecva.net/papers/eccv_2024/papers_ECCV/papers/03193.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Fig. 2: A general framework for entropy coding in neural data compression. It consists of an encoder-decoder structure to extract a compact latent representation z and a prior m 335fcb17783f866561497e7d64e9"}, {"id": "P054_F4_p05", "title": "LinNet: Linear Network for Efficient Point Cloud Representation Learning", "category": "09_三维视觉与神经渲染", "layout_style": "L11", "visual_style": "V02", "source_url": "https://proceedings.neurips.cc/paper_files/paper/2024/hash/4bfcebedf7a2967c410b64670f27f904-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/4bfcebedf7a2967c410b64670f27f904-Paper-Conference.pdf", "figure_number": "4", "pdf_page": 5, "caption": "Figure 4: Comparison of various local aggregation. Each square represents the semantic feature, while each rectangle represents relative coordinates. The number of neighbors is 3. The blue line indicates a mapping in a high-dimensional space (e.g., from 3 + c to c, or c to c), and the red line indicates a mapping from a lower dimension to a higher dimension (e.g., from 3 to c). More blue lines indicate more computation.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "09", "kind": "paper_reference", "year": 2024, "venue": "NeurIPS", "image": "references/09_三维视觉与神经渲染/P054/figures/P054_F4_p05.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "69853d7773323d551119608f01102b0bbbf019adc4ef5b278f310cdb76a24bad"}, {"id": "P055_F1_p05", "title": "HyperPrism: An Adaptive Non-linear Aggregation Framework for Distributed Machine Learning over Non-IID Data and Time-varying Communication Links", "category": "10_计算机系统与数据流程", "layout_style": "L04", "visual_style": "V04", "source_url": "https://proceedings.neurips.cc/paper_files/paper/2024/hash/15e5fccdfeb10bb54f8e74944de1c8bf-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/15e5fccdfeb10bb54f8e74944de1c8bf-Paper-Conference.pdf", "figure_number": "1", "pdf_page": 5, "caption": "Figure 1: The Overview of HyperPrism Framework. ①Device i executes local update on its own dataset. ② Device i adaptively generates degrees of pθ and pφ for the representation and decision parts by hypernetworks. ③Device i maps the model to the mirror space by raising the parameters with the degree of power pθ and pφ, respectively. ④Device i communicates with its neighbors exchanging local models. ⑤Device i aggregates received models in mirror space with WPM. ⑥Device i inverses the model to primal space by the degree of power pθ and pφ, then finishes the round.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "10", "kind": "paper_reference", "year": 2024, "venue": "NeurIPS", "image": "references/10_计算机系统与数据流程/P055/figures/P055_F1_p05.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "c66d9f2ae022009d0809600b2472ac5a5111da8ccc0130e142eb534e8ce3327b"}, {"id": "P056_F1_p04", "title": "Goal Reduction with Loop-Removal Accelerates RL and Models Human Brain Activity in Goal-Directed Learning", "category": "11_因果与AI科学机制", "layout_style": "L09", "visual_style": "V05", "source_url": "https://proceedings.neurips.cc/paper_files/paper/2024/hash/05b2ea5d57ed04c1dc105658e87b137e-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/05b2ea5d57ed04c1dc105658e87b137e-Paper-Conference.pdf", "figure_number": "1", "pdf_page": 4, "caption": "Fig. 1: A: A schematic view of how a goal-reducer can be integrated with a policy network to generate actions. B: 3 types of subgoal sampling strategies. Red triangles: current states, green squares: goals, light green squares: subgoals sampled. C: An diagram of filtration radius changes trajectory connectivity. D: An example of proper filtered trajectory (black) compared with original random walk (gray) in 3D space.", "crop_note": "仅裁出机制图形 aper/2024/hash/0e797d5139ad94fc2dc2080c09119f29-Abstract-Conference.html", "pdf_url": "https://proceedings.neurips.cc/paper_files/paper/2024/file/0e797d5139ad94fc2dc2080c09119f29-Paper-Conference.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2: Introduced compositional algorithmic tasks. Left: The Pointer Execution (PE)’s neighbor (PEN), together with the Pointer Execution (PE) and Pointer Execution Verbose (PEV) sub-tasks. Starting left, the output is obtained by matching words and predicting the current word (in PE) or its neighbor (in PEV and PEN). Our matching criterion is that the two end characters of the current word are equal to the first two characters of the matched word. By ensuring that there are no ambiguities in the input string, an attention mechanism can find the match by retrieving the last two characters of the word and matching it with the (unique) word that starts with them. Right: The Pointer Execution Reverse Multicount (PERM), together with the Pointer Execution (PE) and Pointer Execution Reverse (PER) sub-tasks. PERM first outputs the last word in the matching sequence and then goes backward. The number in the answer for each word is the count of matches times the count of left matches (i.e., arrow to the left in the forward matching sequence).", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2024, "venue": "NeurIPS", "image": "references/02_Transformer与注意力/P058/figures/P058_F2_p04.png", "description": "注意力与信息交互", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "c62f1a3a8f589227413538ee857489a23e1d564a326ea261827f4ccb61bf0194"}, {"id": "P060_F1_p03", "title": "Enhancing Size Generalization in Graph Neural Networks through Disentangled Representation Learning", "category": "03_图神经网络与关系推理", "layout_style": "L02", "visual_style": "V01", "so xisting works while solid lines are for that of our SAPT in this work.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2024, "venue": "ACL", "image": "references/02_Transformer与注意力/P071/figures/P071_F1_p01.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "d2f525c9364e892842737712ddbd559af193bc6fd4d8a272c4f3cb66c5eb1814"}, {"id": "P071_F2_p03", "title": "SAPT : A Shared Attention Framework for Parameter-Efficient Continual Learning of Large Language Models", "category": "02_Transformer与注意力", "layout_style": "L04", "visual_style": "V01", "source_url": "https://aclanthology.org/2024.acl-long.625/", "pdf_url": "https://aclanthology.org/2024.acl-long.625.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2: The overall architecture of our proposed SAPT. We assume that SAPT is currently at the time step 3 to learn the task T3. (1) In the SALS, as illustrated by the solid lines, the resulting attention weight a3 of task T3 is first obtained via the instance-level shared attention operation between the input x3 and PET key vectors {k1, k2, k3}, to perform weighted combination of all PET blocks {B1, B2, B3} for the attentive learning of the current task T3. And dashed lines display the process of attentive selection, following the same process of shared attention to reach the attention weight a3 and utilizing it to handle given inputs at the testing time. (2) In the ARM, for previous tasks T1 and T2, the current attention weights of them ( ˆa1 and ˆa2), are pulled back to their original states (a1 and a2), with the introduction of generated pseudo samples ˆx1 and ˆx2.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2024, "venue": "ACL", "image": " h expert advice. The right section outlines the RCT experiment to see if LLM-generated stories improve comprehension in legal concepts.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "12", "kind": "paper_reference", "year": 2024, "venue": "ACL", "image": "references/05_检索增强与知识系统/P074/figures/P074_F1_p03.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "888531ce6478dbf50dca06810a4b6b846553e82c1624f9ed223c194347aa90f8"}, {"id": "P075_F2_p02", "title": "Tuning Large Multimodal Models for Videos using Reinforcement Learning from AI Feedback", "category": "06_多模态与跨模态融合", "layout_style": "L07", "visual_style": "V01", "source_url": "https://aclanthology.org/2024.acl-long.52/", "pdf_url": "https://aclanthology.org/2024.acl-long.52.pdf", "figure_number": "2", "pdf_page": 2, "caption": "Figure 2: Illustration of the proposed VLM-RLAIF. An LLM tuned with video-text instruction-following data, i.e., multimodal SFT model, often produces responses that are not temporally and visually grounded to the video input, as depicted in red color. We propose a method that involves using the VLMM to supervise itself by providing self-preference feedback of generated responses using reward model, refining itself and facilitating the alignment of video and text modalities.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "06", "kind": "paper_reference", "year": 2024, "venue": "ACL", "image": "references/06_多模态与跨模态融合/P075/figures/P075_F2_p02.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "bb868a4f56c350d427868af4ce0d7791604af71d3fa777f5a8dd7e77bc09db62"}, {"id": "P076_F1_p05", "title": "Language Model Adaption for Reinforcement Le d=YicbFdNTTy", "pdf_url": "https://arxiv.org/pdf/2010.11929", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1: Model overview. We split an image into ﬁxed-size patches, linearly embed each of them, add position embeddings, and feed the resulting sequence of vectors to a standard Transformer encoder. In order to perform classiﬁcation, we use the standard approach of adding an extra learnable “classiﬁcation token” to the sequence. The illustration of the Transformer encoder was inspired by Vaswani et al. (2017).", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2021, "venue": "ICLR", "image": "references/02_Transformer与注意力/P098/figures/P098_F1_p03.png", "description": "网络架构图", "source_kind": "author_preprint_of_verified_conference_paper", "copy_note": "OpenReview returned HTTP 403; downloaded the publicly available arXiv author version.", "rights": "Original authors/publisher; check source license", "image_sha256": "d8112294b6db3ff3f2e81be7e5d5ab374117ba9951a0b225983b94a9fc0a5a0c"}, {"id": "P099_F1_p04", "title": "Graph Attention Networks", "category": "03_图神经网络与关系推理", "layout_style": "L05", "visual_style": "V05", "source_url": "https://openreview.net/forum?id=rJXMpikCZ", "pdf_url": "https://arxiv.org/pdf/1710.10903", "figure_number": "1", "pdf_page": 4, "caption": "Figure 1: Left: The attention mechanism a(W⃗hi, W⃗hj) employed by our model, parametrized by a weight vector⃗a ∈R2F ′, applying a LeakyReLU activation. Right: An illustration of multi- head attention (with K = 3 heads) by node 1 on its neighborhood. Different arrow styles and colors denote independent attention computations. The aggregated features from each head are concatenated or averaged to obtain⃗h′", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2018, "venue": "ICLR", "image": "references/02_Transformer与注意力/P099/figures/P099_F1_p04.png", "description": "注意力与信息交互", "source_kind": "author_preprint_of_verified_conference_paper", "copy_note": "OpenReview returned HTTP 403; downloaded the publicly available arXiv author version.", "rights": "Original authors/publisher; check source license", "image_sha256": "7ce5120f538c12bae801b1f87645f05c01436f64e6e9eb8b8f0ebb23a2d92f1b"}, {"id": "P100_F1_p04", "title": "Semi-Supervised Classification with Graph Convolutional Networks", "category": "03_图神经网络与关系推理", "layout_style": "L05", "visual_style": "V05", "source_url": "https://openreview.net/forum?id=SJU4ayYgl", "pdf_url": "https://arxiv.org/pdf/1609.02907", "figure_number": "1", "pdf_page": 4, "caption": "Figure 1: Left: Schematic depiction of multi-layer Graph Convolutional Network (GCN) for semi- supervised learning with C input channels and F feature maps in the output layer. The graph struc- ture (edges shown as black lines) is shared over layers, labels are denoted by Yi. Right: t-SNE (Maaten & Hinton, 2008) visualization of hidden layer activations of a two-layer GCN trained on the Cora dataset (Sen et al., 2008) using 5% of labels. Colors denote document class.", "crop_note": "左侧 GCN 结构，剔除右侧嵌入结果", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "03", "kind": "paper_reference", "year": 2017, "venue": "ICLR", "image": "references/03_图神经网络与关系推理/P100/figures/P100_F1_p04.png", "description": "图结构与消息传递", "source_kind": "author_preprint_of_verified_conference_paper", "copy_note": "OpenReview returned HTTP 403; downloaded the publicly available arXiv author version.", "rights": "Original authors/publisher; check source license", "image_sha256": "6906eca85c9fcc16c2d004a5ee7920d54c59de062b38dde31897d003ff89150f"}, {"id": "P102_F3_p04", "title": "Instant Neural Graphics Primitives with a Multiresolution Hash Encoding", "category": "09_三维视觉与神经渲染", "layout_style": "L01", "visual_style": "V03", "source_url": "https://nvlabs.github.io/instant-ngp/", "pdf_url": "https://nvlabs.github.io/instant-ngp/assets/mueller2022instant.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Fig. 3. Illustration of the multiresolution hash encoding in 2D. (1) for a given input coordinate x, we find the surrounding voxels at 𝐿resolution levels and assign indices to their corners by hashing their integer coordinates. (2) for all resulting corner indices, we look up the corresponding 𝐹-dimensional feature vectors from the hash tables 𝜃𝑙and (3) linearly interpolate them according to the relative position of x within the respective 𝑙-th voxel. (4) we concatenate the result of each level, as well as auxiliary inputs 𝜉∈R𝐸, producing the encoded MLP input 𝑦∈R𝐿𝐹+𝐸, which (5) is evaluated last. To train the encoding, loss gradients are backpropagated through the MLP (5), the concatenation (4), the linear interpolation (3), and then accumulated in the looked-up feature vectors.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "09", "kind": "paper_reference", "year": 2022, "venue": "ACM TOG / SIGGRAPH", "image": "references/03_图神经网络与关系推理/P102/figures/P102_F3_p04.png", "description": "机制示意与总体框架", "source_kind": "official_or_author_public_copy", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "537ea403ba441b40946393fc0f2b11b767ea3434a8b83e11de447e4d0ca507a6"}, {"id": "P104_F2_p03a", "title": "Accurate structure prediction of biomolecular interactions with AlphaFold 3", "category": "11_因果与AI科学机制", "layout_style": "L04", "visual_style": "V01", "source_url": "https://www.nature.com/articles/s41586-024-07487-w", "pdf_url": "https://www.nature.com/articles/s41586-024-07487-w.pdf", "figure_number": "2a", "pdf_page": 3, "caption": "Fig. 2 | Architectural and training details. a, The pairformer module.   Input and output: pair representation with dimension (n, n, c) and single  representation with dimension (n, c). n is the number of tokens (polymer  residues and atoms); c is the number of channels (128 for the pair representation,  384 for the single representation). Each of the 48 blocks has an independent set  of trainable parameters. b, The diffusion module. Input: coarse arrays depict  per-token representations (green, inputs; blue, pair; red, single). Fine arrays  depict per-atom representations. The coloured balls represent physical atom  coordinates. Cond., conditioning; rand. rot. trans., random rotation and  translation; seq., sequence. c, The training set-up (distogram head omitted)", "crop_note": "子图 a：表征网络机制", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2024, "venue": "Nature", "image": "references/11_因果与AI科学机制/P104/figures/P104_F2_p03a.png", "description": "训练机制与学习流程", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "562c9aa0992b8ed0fdaaff21776491479db1071b5ffaf8823cc279c46eed1775"}, {"id": "P104_F2_p03b", "title": "Accurate structure prediction of biomolecular interactions with AlphaFold 3", "category": "11_因果与AI科学机制", "layout_style": "L07", "visual_style": "V01", "source_url": "https://www.nature.com/articles/s41586-024-07487-w", "pdf_url": "https://www.nature.com/articles/s41586-024-07487-w.pdf", "figure_number": "2b", "pdf_page": 3, "caption": "Fig. 2 | Architectural and training details. a, The pairformer module.   Input and output: pair representation with dimension (n, n, c) and single  representation with dimension (n, c). n is the number of tokens (polymer  residues and atoms); c is the number of channels (128 for the pair representation,  384 for the single representation). Each of the 48 blocks has an independent set  of trainable parameters. b, The diffusion module. Input: coarse arrays depict  per-token representations (green, inputs; blue, pair; red, single). Fine arrays  depict per-atom representations. The coloured balls represent physical atom  coordinates. Cond., conditioning; rand. rot. trans., random rotation and  translation; seq., sequence. c, The training set-up (distogram head omitted)", "crop_note": "子图 c：扩散结构机制，剔除子图 b 训练曲线", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2024, "venue": "Nature", "image": "references/11_因果与AI科学机制/P104/figures/P104_F2_p03b.png", "description": "训练机制与学习流程", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "3e0b7b28ac9203292c6ca40617426e010dbbf3227f169ea02f6faa01914704b4"}, {"id": "P105_F3_p04", "title": "Highly accurate protein structure prediction with AlphaFold", "category": "11_因果与AI科学机制", "layout_style": "L04", "visual_style": "V01", "source_url": "https://www.nature.com/articles/s41586-021-03819-2", "pdf_url": "https://www.nature.com/articles/s41586-021-03819-2.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Fig. 3 | Architectural details. a, Evoformer block. Arrows show the information  flow. The shape of the arrays is shown in parentheses. b, The pair representation  interpreted as directed edges in a graph. c, Triangle multiplicative update and  triangle self-attention. The circles represent residues. Entries in the pair  representation are illustrated as directed edges and in each diagram, the edge  being updated is ij. d, Structure module including Invariant point attention (IPA)", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2021, "venue": "Nature", "image": "references/11_因果与AI科学机制/P105/figures/P105_F3_p04.png", "description": "图结构与消息传递", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "3ec12487b3e781f105eaf3ad02ac16c60ca917878c075785cb1259f6d8ae1972"}, {"id": "P106_F1_p02", "title": "Spatially embedded recurrent neural networks reveal widespread links between structural and functional neuroscience findings", "category": "11_因果与AI科学机制", "layout_style": "L05", "visual_style": "V05", "source_url": "https://www.nature.com/articles/s42256-023-00748-9", "pdf_url": "https://www.nature.com/articles/s42256-023-00748-9.pdf", "figure_number": "1", "pdf_page": 2, "caption": "Fig. 1 | Task structure and seRNNs. a, We use regularization to influence  network structure during training to promote smaller network weights and  hence a sparser connectome. b, Through regularization, we embed RNNs in  Euclidean space by assigning units a location on an even 5 × 5 × 4 grid. We show  a schematic of a six-node network in its space. c, We similarly embed RNNs in a  topological space, guiding the pruning process towards efficient intra-network  communication operationalized by a weighted communicability measure (see  main text). The weighted communicability term is shown for the same network.  d, When these constraints are placed within a joint regularization term, networks  are incentivized to strengthen short connections, which are core to the networks  topological structure, and weaken long connections, which are peripheral.  Networks are generally incentivized to weaken connections while optimizing  task performance. e, In the main study, we trained 1,000 L1-regularized RNNs as a  baseline. L1 networks optimize task performance while minimizing the strength  of their absolute weights (W). The network receives task inputs from an eight-", "crop_note": "左侧空间网络约束机制，剔除右侧统计热图", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2023, "venue": "Nature Machine Intelligence", "image": "references/11_因果与AI科学机制/P106/figures/P106_F1_p02.png", "description": "训练机制与学习流程", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "d15887aca4d2f8e12300c589267661854f06e623fa476b1e5b3fe869b74792e8"}, {"id": "P107_F1_p02", "title": "Augmenting large language models with chemistry tools", "category": "11_因果与AI科学机制", "layout_style": "L07", "visual_style": "V04", "source_url": "https://www.nature.com/articles/s42256-024-00832-8", "pdf_url": "https://www.nature.com/articles/s42256-024-00832-8.pdf", "figure_number": "1", "pdf_page": 2, "caption": "Fig. 1 | Overview and toolset. a, An overview of the task-solving process. Using  a variety of chemistry-related packages and software, a set of tools is created.  These tools and a user input are then given to an LLM. The LLM proceeds  through an automatic, iterative chain-of-thought process, deciding on its path,", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2024, "venue": "Nature Machine Intelligence", "image": "references/12_通用方法与总体框架/P107/figures/P107_F1_p02.png", "description": "机制示意与总体框架", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "3eaca82db3fc676e2f50fc76c065fe7bffff5b6c0f8dc11e8dac5ef661d9c2eb"}, {"id": "P108_F1_p03", "title": "Deep learning of causal structures in high dimensions under data limitations", "category": "11_因果与AI科学机制", "layout_style": "L09", "visual_style": "V04", "source_url": "https://www.nature.com/articles/s42256-023-00744-z", "pdf_url": "https://www.nature.com/articles/s42256-023-00744-z.pdf", "figure_number": "1", "pdf_page": 3, "caption": "Fig. 1 | Conceptual overview of the proposed learning scheme and its  application in large-scale biological experiments. The neural architecture  learns causal structures by combining data and prior knowledge, resulting in  a graph G intended to represent causal, not just correlational, relationships  between system variables. In an abstract workflow (left), empirical data from  a specific system are combined with prior causal knowledge to estimate the  unknown causal structure. In the biological problem workflow (right), data  are gathered from a specific biological system, and causal prior knowledge is  derived from established science or interventional experiments on the system.  The model seeks to generalize from the limited inputs to learn a global graph,  spanning all system variables.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2023, "venue": "Nature Machine Intelligence", "image": "references/11_因果与AI科学机制/P108/figures/P108_F1_p03.png", "description": "图结构与消息传递", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "faacaadd52cb82bde550128035d68da4b30b74115abf6993969515cfc77335bc"}, {"id": "P108_F2_p03", "title": "Deep learning of causal structures in high dimensions under data limitations", "category": "11_因果与AI科学机制", "layout_style": "L07", "visual_style": "V05", "source_url": "https://www.nature.com/articles/s42256-023-00744-z", "pdf_url": "https://www.nature.com/articles/s42256-023-00744-z.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Fig. 2 | Overview of the D2CL architecture, training and inference. D2CL  combines empirical data on multiple variables with prior causal knowledge to  learn causal relationships between variables. For any pair of variables Xi and Xj  (corresponding to two columns of the input data matrix), D2CL seeks to learn  whether Xi has a causal influence on Xj, Xj on Xi, or neither. This is done using a  neural architecture with two components: a CNN tower aimed at learning  distributional features and a GNN tower that detects structural regularities.   For an ordered pair (Xi, Xj), the CNN tower captures distributional information   via a density estimate that traverses the tower to form an embedding. The GNN  tower extracts a subgraph from an initial graph ̂G0 and computes an embedding  containing structural information on the neighbourhood of the nodes. The CNN  and GNN embeddings are then merged through multiple layers, which finally  output the probability of a directed causal relationship. The input causal  information is used to provide a training signal (see main text for details).   During inference, the network generalizes beyond the initial inputs to provide   an estimate of the global graph spanning all variables of interest.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "11", "kind": "paper_reference", "year": 2023, "venue": "Nature Machine Intelligence", "image": "references/11_因果与AI科学机制/P108/figures/P108_F2_p03.png", "description": "图结构与消息传递", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "1b5a24b2644f41b41817caa8e63d2be1e6ab6e902a28eeacddaba0580d56e7b3"}, {"id": "P109_F1_p02", "title": "What large language models know and what people think they know", "category": "12_通用方法与总体框架", "layout_style": "L09", "visual_style": "V04", "source_url": "https://www.nature.com/articles/s42256-024-00976-7", "pdf_url": "https://www.nature.com/articles/s42256-024-00976-7.pdf", "figure_number": "1", "pdf_page": 2, "caption": "Fig. 1 | Overview of the evaluation methodology for assessing the calibration  gap between model confidence and human confidence in the model. The  multiple-choice questions, the approach works as follows: (1) prompt the LLM  with a question to obtain the model’s internal confidence for each answer choice;  (2) select the most likely answer and prompt the model a second time to generate  an explanation for the given answer; (3) obtain the human confidence by showing  users the question and the LLM's explanation and asking users to indicate the  probability that the model is correct. In this toy example, the model confidence for", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "12", "kind": "paper_reference", "year": 2025, "venue": "Nature Machine Intelligence", "image": "references/12_通用方法与总体框架/P109/figures/P109_F1_p02.png", "description": "机制示意与总体框架", "source_kind": "official_open_access_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "052c41c9b7c597359c03945244c76c0c80081759a6ce6860e0a929d8d4ef2d82"}, {"id": "P110_F2_p03", "title": "nsDB: Architecting the Next Generation Database by Integrating Neural and Symbolic Systems (Vision)", "category": "10_计算机系统与数据流程", "layout_style": "L04", "visual_style": "V02", "source_url": "https://www.vldb.org/pvldb/vol17/p3283-tang.pdf", "pdf_url": "https://vldb.org/pvldb/vol17/p3283-tang.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2: The architecture overview of nsDB", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "10", "kind": "paper_reference", "year": 2024, "venue": "PVLDB", "image": "references/10_计算机系统与数据流程/P110/figures/P110_F2_p03.png", "description": "网络架构图", "source_kind": "official_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "bb6d52b3679a5f7e0da5d87e0972e7f0f5f01838558547aa316df97015ab6e62"}, {"id": "P110_F5_p05", "title": "nsDB: Architecting the Next Generation Database by Integrating Neural and Symbolic Systems (Vision)", "category": "10_计算机系统与数据流程", "layout_style": "L04", "visual_style": "V01", "source_url": "https://www.vldb.org/pvldb/vol17/p3283-tang.pdf", "pdf_url": "https://vldb.org/pvldb/vol17/p3283-tang.pdf", "figure_number": "5", "pdf_page": 5, "caption": "Figure 5: The architecture of query optimizer in nsDB, adapted from our preliminary work [53]", "crop_note": "仅裁出机制图形；图注见索引", "style_revie
