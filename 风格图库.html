ET: Efficient Learned Query Execution over Text and Tables", "category": "10_计算机系统与数据流程", "layout_style": "L01", "visual_style": "V01", "source_url": "https://www.vldb.org/pvldb/vol17/p4867-urban.pdf", "pdf_url": "https://vldb.org/pvldb/vol17/p4867-urban.pdf", "figure_number": "2", "pdf_page": 2, "caption": "Figure 2: Overview of ELEET. In an offline phase, the ELEET-model can be fine-tuned for unseen domains 1○. Fine-tuning the ELEET-model for an unseen domain is a one-time effort and requires a small sample of a few labeled texts. 2○For query execution, ELEET uses multi-modal query plans that contain traditional (white) and multi-modal database operators (purple). To compute the result of a multi-modal operation such as a join over texts, the ELEET-model is used (see a○to c○): During the execution of a multi-modal operation, the ELEET model first computes embeddings of the query attributes, texts, and table input", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "10", "kind": "paper_reference", "year": 2024, "venue": "PVLDB", "image": "references/10_计算机系统与数据流程/P114/figures/P114_F2_p02.png", "description": "机制示意与总体框架", "source_kind": "official_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "223f88e0d0fbfff2425b83b233fef1532edd29ffae50a0ddcabfeec0bbd7b245"}, {"id": "P114_F3_p05", "title": "ELEET: Efficient Learned Query Execution over Text and Tables", "category": "10_计算机系统与数据流程", "layout_style": "L04", "visual_style": "V01", "source_url": "https://www.vldb.org/pvldb/vol17/p4867-urban.pdf", "pdf_url": "https://vldb.org/pvldb/vol17/p4867-urban.pdf", "figure_number": "3", "pdf_page": 5, "caption": "Figure 3: Model architecture. After encoding a batch of se- quences that each contain an input text, the latent attributes, and traditional table values 1○using 12 (11+1) transformer layers 2○a○, all embeddings corresponding to the same cells or latent attributes are pooled, before vertical attention lets signal flow between groups of k rows b○. A separate final transformer layer computes a second set of text embeddings optimized for detecting duplicates c○. The decoder 3○con- sists of several heads for the different sub-tasks for extracting table data from texts. For instance, the row-detect head is used to find extractions in the text. For this, it pairs the em- bedding of each text token with the embedding of a masked cell (i.e., the attribute to be extracted) and classifies whether the token is part of the attribute or not. The tokens that are marked to be extracted are inserted into the output table 4○.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "10", "kind": "paper_reference", "year": 2024, "venue": "PVLDB", "image": "references/10_计算机系统与数据流程/P114/figures/P114_F3_p05.png", "description": "注意力与信息交互", "source_kind": "official_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "2cd45fa121b194dcf690a35ea7aa836d027c4fe9f0b072b7e8be0e2b89db214d"}, {"id": "P115_F2_p04", "title": "TenGraph: A Tensor-Based Graph Query Engine", "category": "10_计算机系统与数据流程", "layout_style": "L11", "visual_style": "V01", "source_url": "https://www.vldb.org/pvldb/vol17/p4571-li.pdf", "pdf_url": "https://vldb.org/pvldb/vol17/p4571-li.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2: System Overview of TenGraph.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "10", "kind": "paper_reference", "year": 2024, "venue": "PVLDB", "image": "references/03_图神经网络与关系推理/P115/figures/P115_F2_p04.png", "description": "图结构与消息传递", "source_kind": "official_journal", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "ed966740326fa998e7909c77ab7b2a2de7b43f849964fc4a1b23eb626e1edaf0"}, {"id": "P115_F3_p04", "titl aper", "copy_note": "作者公开预印本；期刊身份由 DOI / 正式书目信息确认", "rights": "Original authors/publisher; check source license", "image_sha256": "4b942c8c68ef98caca576811c96f262477538a59d108623016ffa1d202e64d48"}, {"id": "P121_F2_p03", "title": "Spectral State Space Model for Rotation-Invariant Visual Representation Learning", "category": "02_Transformer与注意力", "layout_style": "L06", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Dastani_Spectral_State_Space_Model_for_Rotation-Invariant_Visual_Representation_Learning_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Dastani_Spectral_State_Space_Model_for_Rotation-Invariant_Visual_Representation_Learning_CVPR_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. The Spectral Traversal Scan (STS) architecture begins by representing image patches as a graph. The Laplacian spectrum of this graph is then generated, and its eigenvectors are computed. The traversal path for the image patches is determined by the order of eigenvectors. The 1st eigenvector traverses the foreground/background regions, the 2nd eigenvector focuses on the next most salient structures, and each subsequent eigenvector progressively captures finer details in the image.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2025, "venue": "CVPR", "image": "references/02_Transformer与注意力/P121/figures/P121_F2_p03.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "63b6f1d966a103f1ff9d1d069bcd4b2a4636a90462b9aeef32fca1f9a0e7faf8"}, {"id": "P121_F3_p05", "title": "Spectral State Space Model for Rotation-Invariant Visual Representation Learning", "category": "02_Transformer与注意力", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Dastani_Spectral_State_Space_Model_for_Rotation-Invariant_Visual_Representation_Learning_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Dastani_Spectral_State_Space_Model_for_Rotation-Invariant_Visual_Representation_Learning_CVPR_2025_paper.pdf", "figure_number": "3", "pdf_page": 5, "caption": "Figure 3. An overview of the proposed method. Our network consists of two primary components: the RFN module, which normalizes feature orientation to ensure consistency across different perspectives, and a series of Spectral VMamba blocks that process data in three stages: (1) Spectral Traversal Scan (STS), (2) S6 block (selective scan), and (3) Spectral Traversal Merge (STM). In STS, patches are reordered based on spectral coherence derived from the Laplacian spectrum. Each sequence is then processed in parallel by dedicated S6 blocks, capturing localized patterns, and finally merged in STM to reconstruct the spatial layout, producing the final feature map.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2025, "venue": "CVPR", "image": "references/02_Transformer与注意力/P121/figures/P121_F3_p05.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "499cb79eb9e1cb7f528a27ed46a1a8b03e1056a2c6272619003eb6089c0b90bf"}, {"id": "P122_F2_p03", "title": "VasTSD: Learning 3D Vascular Tree-state Space Diffusion Model for Angiography Synthesis", "category": "02_Transformer与注意力", "layout_style": "L04", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Wang_VasTSD_Learning_3D_Vascular_Tree-state_Space_Diffusion_Model_for_Angiography_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Wang_VasTSD_Learning_3D_Vascular_Tree-state_Space_Diffusion_Model_for_Angiography_CVPR_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. The overall framework of VasTSD. VasTSD contains a pre-trained vision embedder and a 3D vascular tree-state space diffusion module. The vision embedder encodes 3D medical data and generates embeddings for the diffusion process. The 3D vascular state space diffusion module consists of a forward diffusion and a 3D denoising process based on tree-state space.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2025, "venue": "CVPR", "image": "references/02_Transformer与注意力/P122/figures/P122_F2_p03.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "ffeb72558b4d3c936d3ee475f26c069b10f7d41c5ca83e5224f62f0613d07afe"}, {"id": "P122_F3_p05", "title": "VasTSD: Learning 3D Vascular Tree-state Space Diffusion Model for Angiography Synthesis", "category": "02_Transformer与注意力", "layout_style": "L04", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Wang_VasTSD_Learning_3D_Vascular_Tree-state_Space_Diffusion_Model_for_Angiography_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Wang_VasTSD_Learning_3D_Vascular_Tree-state_Space_Diffusion_Model_for_Angiography_CVPR_2025_paper.pdf", "figure_number": "3", "pdf_page": 5, "caption": "Figure 3. Vascular Tree-state space architecture. A dynamic tree is constructed from vessel features and spatial relationships, with embeddings guided by prior slice information.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "02", "kind": "paper_reference", "year": 2025, "venue": "CVPR", "image": "references/02_Transformer与注意力/P122/figures/P122_F3_p05.png", "description": "网络架构图", "sour -Supervised_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Hermosilla_Masked_Scene_Modeling_Narrowing_the_Gap_Between_Supervised_and_Self-Supervised_CVPR_2025_paper.pdf", "figure_number": "5", "pdf_page": 5, "caption": "Figure 5. Hierarchical reconstruction. The masked voxelization is processed by our hierarchical encoder. The decoder processes the encoded features in a bottom-up manner by first including the masked voxels with a learnable token. Each level is used in the loss computation before the decoded features are upscaled and com- bined with the skip connection from the previous level.", "crop_note": "仅裁出机制图形；图注见索引", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": null, "topic": "08", "kind": "paper_reference", "year": 2025, "venue": "CVPR", "image": "references/08_训练策略与自监督/P128/figures/P128_F5_p05.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "原论文集/出版商公开版本", "rights": "Original authors/publisher; check source license", "image_sha256": "736fa47922a9201ad31eb37bfd3b946079b57fa84e2e64fad6bbb40aacddd11c"}, {"id": "P129_F2_p03", "title": "LiveCC: Learning Video LLM with Streaming Speech Transcription at Scale", "category": "10_计算机系统与数据流程", "layout_style": "L08", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/CVPR2025/html/Chen_LiveCC_Learning_Video_LLM_with_Streaming_Speech_Transcription_at_Scale_CVPR_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/CVPR2025/papers/Chen_LiveCC_Learning_Video_LLM_with_Streaming_Speech_Transcription_at_Scale_CVPR_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. LiveCC data pipeline. We begin by integrating sev- eral large-scale YouTube video datasets [56, 80, 81, 86], followed by metadata filtering, resulting in a curated pool of 8.3M videos. Then, the pre-training dataset is built using the original YouTube CC, while the SFT dataset leverages higher-quality ASR transcrip- copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "36b11be486ed22adaf32df4c8920d2d73f8301c0363f033f7b5d238d36f5d8dc"}, {"id": "P134_F2_p04", "title": "3DGraphLLM: Combining Semantic Graphs and Large Language Models for 3D Scene Understanding", "category": "03_图神经网络与关系推理", "layout_style": "L04", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Zemskova_3DGraphLLM_Combining_Semantic_Graphs_and_Large_Language_Models_for_3D_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Zemskova_3DGraphLLM_Combining_Semantic_Graphs_and_Large_Language_Models_for_3D_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. The overall architecture of our approach. We introduce trainable layers to map the extracted graph node and edge features into the token embedding space of a pre-trained LLM. The scene graph is flattened for input into the LLM, with each object represented by a subgraph of its k nearest neighbors. To further adapt the LLM to 3D vision-language tasks, we add new object tokens to the LLM’s vocabulary alongside with objects’ 2D features and fine-tune the LLM using LoRa.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "03", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/03_图神经网络与关系推理/P134/figures/P134_F2_p04.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "466b86cc0668d927686341ab10470918baa4662185173f8687374f25f5a846d7"}, {"id": "P135_F2_p03", "title": "Golden Noise for Diffusion Models: A Learning Framework", "category": "04_生成模型与扩散机制", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Zhou_Golden_Noise_for_Diffusion_Models_A_Learning_Framework_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Zhou_Golden_Noise_for_Diffusion_Models_A_Learning_Framework_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Our workflow diagram consists of three main stages. Stage I: We begin by denoising the original random Gaussian noise xT to obtain xT −1, and then use DDIM-Inversion(·) to obtain inverse x′", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "04", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/04_生成模型与扩散机制/P135/figures/P135_F2_p03.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "bd6d94a76ca7f00d5661d1c6516e08e1ffc4f2999401978d6d22ec0b7479f630"}, {"id": "P136_F2_p03", "title": "LoRAverse: A Submodular Framework to Retrieve Diverse Adapters for Diffusion Models", "category": "04_生成模型与扩散机制", "layout_style": "L02", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Sonmezer_LoRAverse_A_Submodular_Framework_to_Retrieve_Diverse_Adapters_for_Diffusion_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Sonmezer_LoRAverse_A_Submodular_Framework_to_Retrieve_Diverse_Adapters_for_Diffusion_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Architecture of LoRAverse. LoRAverse composed of two main modules: concept extractor and submodular retriever. The concept extractor processes the user prompt to identify concepts (keywords). These concepts guide to the submodular retriever, which selects a diverse and relevant subset of LoRA adapters by clustering similar adapters per concept and applying submodular optimization. Additionally, a safety-checking mechanism is integrated to filter out adapters containing offe ation unit (GDAU) to explore frame-wise dynamic variations. Based on enhanced spatiotemporal and dynamic features, STDDNet generates refined polyp segmentation results.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "02", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/02_Transformer与注意力/P144/figures/P144_F2_p03.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "7901ffd2671a322dad96527566b72a14b207118aad3558b4c9c92a262ce159c0"}, {"id": "P144_F3_p04", "title": "STDDNet: Harnessing Mamba for Video Polyp Segmentation via Spatial-aligned Temporal Modeling and Discriminative Dynamic Representation Learning", "category": "02_Transformer与注意力", "layout_style": "L04", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Chen_STDDNet_Harnessing_Mamba_for_Video_Polyp_Segmentation_via_Spatial-aligned_Temporal_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Chen_STDDNet_Harnessing_Mamba_for_Video_Polyp_Segmentation_via_Spatial-aligned_Temporal_ICCV_2025_paper.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3. Illustration of STDP. The horizontally concatenated in- put features are fed into a bidirectional scanning Mamba block to model spatiotemporal dependency.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "02", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/02_Transformer与注意力/P144/figures/P144_F3_p04.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "db2ddf09ad38782ceaae590caa103bb491dde41f2937f175837ef9af103640fc"}, {"id": "P145_F5_p05", "title": "SeqGrowGraph: Learning Lane Topology as a Chain of Graph Expansions", "category": "03_图神经网络与关系推理", "layout_style": "L01", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Xie_SeqGrowGraph_Learning_Lane_Topology_as_a_Chain_of_Graph_Expansions_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Xie_SeqGrowGraph_Learning_Lane_Topology_as_a_Chain_of_Graph_Expansions_ICCV_2025_paper.pdf", "figure_number": "5", "pdf_page": 5, "caption": "Figure 5. Model architecture and inference process. We employ a BEV-encoder to transform surrounding camera perspective view (PV) images into BEV features. Subsequently, a Transformer de- coder generates tokens of the target sequence based on the BEV features and the beginning of sequence < BOS >. All the tokens generated represent a complete lane graph.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "03", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/03_图神经网络与关系推理/P145/figures/P145_F5_p05.png", "description": "图结构与消息传递", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "b2444c6032d861b23b43e13c248b2deeaff7a6dfffcdf3690779dea77927d480"}, {"id": "P146_F2_p05", "title": "Joint Diffusion Models in Continual Learning", "category": "04_生成模型与扩散机制", "layout_style": "L07", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Skiers_Joint_Diffusion_Models_in_Continual_Learning_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Skiers_Joint_Diffusion_Models_in_Continual_Learning_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 5, "caption": "Figure 2. Overview of JDCL. To adapt the global model to task τ + 1, we first train a local joint diffusion model on task τ + 1 only. We then use the global model and the local model to generate a synthetic dataset consisting of samples from tasks 1, 2 . . . τ + 1. Finally, we fine-tune the global model with the generated dataset and a combination of joint diffusion and knowledge distillation losses.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "04", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/04_生成模型与扩散机制/P146/figures/P146_F2_p05.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "cb2046f325fb8e5f71a47b2288a98f0854622fb1ab20992ecee127553c4d064e"}, {"id": "P147_F1_p03", "title": "FedXDS: Leveraging Model Attribution Methods to counteract Data Heterogeneity in Federated Learning", "category": "10_计算机系统与数据流程", "layout_style": "L01", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Hoefler_FedXDS_Leveraging_Model_Attribution_Methods_to_counteract_Data_Heterogeneity_in_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Hoefler_FedXDS_Leveraging_Model_Attribution_Methods_to_counteract_Data_Heterogeneity_in_ICCV_2025_paper.pdf", "figure_number": "1", "pdf_page": 3, "caption": "Figure 1. Illustration of the DP attribution-guided feature extrac- tion. The process consists of four main steps: (1) Computing attri- bution scores using a warmup model to identify important features, (2) Creating and applying a binary mask based on the attributions, (3) Adding Gaussian noise for metric privacy.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "10", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/05_检索增强与知识系统/P147/figures/P147_F1_p03.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "4eafaa51bd314556ea0faac69dd4a26f6e691abfaf302293a740b168f70d3a55"}, {"id": "P148_F2_p04", "title": "ModalTune: Fine-Tuning Slide-Level Foundation Models with Multi-Modal Information for Multi-task Learning in Digital Pathology", "category": "06_多模态与跨模态融合", "layout_style": "L04", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Ramanathan_ModalTune_Fine-Tuning_Slide-Level_Foundation_Models_with_Multi-Modal_Information_for_Multi-task_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Ramanathan_ModalTune_Fine-Tuning_Slide-Level_Foundation_Models_with_Multi-Modal_Information_for_Multi-task_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Overview of ModalTune. Built on a frozen pre-trained slide encoder (a), our Modal Adapter (b) integrates extra-modal features via the Multi-Modal Feature Injector (c) and Extractor (d). A text embedding module (e) unifies multiple tasks and cancer sites, while the enriched image, task, and modal embeddings are fused for training, ensuring a robust multi-modal, multi-task representation.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "06", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/06_多模态与跨模态融合/P148/figures/P148_F2_p04.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "9d2c23d7a0347c3d569c784c1a3f0f1edc3db23c0d3788c2b58beadd31ba186d"}, {"id": "P149_F1_p01", "title": "Disentangled World Models: Learning to Transfer Semantic Knowledge from Distracting Videos for Reinforcement Learning", "category": "07_强化学习与智能体", "layout_style": "L08", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Wang_Disentangled_World_Models_Learning_to_Transfer_Semantic_Knowledge_from_Distracting_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Wang_Disentangled_World_Models_Learning_to_Transfer_Semantic_Knowledge_from_Distracting_ICCV_2025_paper.pdf", "figure_number": "1", "pdf_page": 1, "caption": "Figure 1. Overview of our proposed framework. The key idea is to leverage distracting videos for semantic knowledge transfer, enabling the downstream agent to improve sample efficiency on unseen tasks.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "07", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/07_强化学习与智能体/P149/figures/P149_F1_p01.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "5a6578dfd100377a8da011c69ec77a807b0cab9568f6896fe273f34b672d00a5"}, {"id": "P149_F2_p03", "title": "Disentangled World Models: Learning to Transfer Semantic Knowledge from Distracting Videos for Reinforcement Learning", "category": "07_强化学习与智能体", "layout_style": "L09", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Wang_Disentangled_World_Models_Learning_to_Transfer_Semantic_Knowledge_from_Distracting_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Wang_Disentangled_World_Models_Learning_to_Transfer_Semantic_Knowledge_from_Distracting_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Architecture of Disentangled World Models. (a) The action-free video prediction model with disentanglement constraints is pre- trained on distracting videos offline for the well-disentangled latent variable zdisen, which extracts semantic knowledge from the visual ob- servations. The disentangled capability of zdisen is then transferred to the world model through latent distillation. (b) The action-conditioned world model is finetuned through disentanglement regularization online, which encourages the factorized representation. Moreover, the incorporation of actions and rewards enriches the diversity of the data, which in turn strengthens the disentangled representation learning.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "07", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/07_强化学习与智能体/P149/figures/P149_F2_p03.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "6f2b502a3023249e221ba464243f1b4be75350493993958ac078ec9c429c3ca6"}, {"id": "P150_F1_p01", "title": "Harnessing Text-to-Image Diffusion Models for Point Cloud Self-Supervised Learning", "category": "04_生成模型与扩散机制", "layout_style": "L07", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Chen_Harnessing_Text-to-Image_Diffusion_Models_for_Point_Cloud_Self-Supervised_Learning_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Chen_Harnessing_Text-to-Image_Diffusion_Models_for_Point_Cloud_Self-Supervised_Learning_ICCV_2025_paper.pdf", "figure_number": "1", "pdf_page": 1, "caption": "Figure 1. Illustration of the forward process and the reverse pro- cess of diffusion models. (a) With the increase of noise, the image first loses low-level texture information and then loses high-level shape information. (b) Denoising at low time step t1, recovering texture information. (c) Denoising at high time step t4, recover- ing texture and shape information. From this figure, we can see that learning via image denoising inevitably introduces low-level information, failing to sufficiently focus on high-level information related to semantics.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "04", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/04_生成模型与扩散机制/P150/figures/P150_F1_p01.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "9eaa3440ba81a9aed49b50053e745718905b1de4f0bff091381cbd1b82dde3af"}, {"id": "P150_F2_p04", "title": "Harnessing Text-to-Image Diffusion Models for Point Cloud Self-Supervised Learning", "category": "04_生成模型与扩散机制", "layout_style": "L04", "visual_style": "V03", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Chen_Harnessing_Text-to-Image_Diffusion_Models_for_Point_Cloud_Self-Supervised_Learning_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Chen_Harnessing_Text-to-Image_Diffusion_Models_for_Point_Cloud_Self-Supervised_Learning_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2. Overall framework of our PointSD. In the first stage, the 3D encoder extracts features to serve as the condition for guiding the denoising process, forming a point-to-image diffusion framework. In the second stage, feature alignment is performed between 3D features and SD features to boost 3D representation learning.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "04", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/04_生成模型与扩散机制/P150/figures/P150_F2_p04.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "268051e8e866429bc5a0bd08fdef221eab61ef6d336ce96c6754d49cc46336d3"}, {"id": "P151_F2_p03", "title": "Prior-aware Dynamic Temporal Modeling Framework for Sequential 3D Hand Pose Estimation", "category": "09_三维视觉与神经渲染", "layout_style": "L04", "visual_style": "V01", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Ren_Prior-aware_Dynamic_Temporal_Modeling_Framework_for_Sequential_3D_Hand_Pose_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Ren_Prior-aware_Dynamic_Temporal_Modeling_Framework_for_Sequential_3D_Hand_Pose_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. Overall Architecture. Our method comprises three primary components: the Dynamic Spatio-temporal Block, the Global Temporal Block, and the Hand Prior Memory. The Dynamic Spatio-temporal Block employs a dual-branch structure to model joint-level spatial and temporal relationships, while the Global Temporal Block extracts hand-level temporal information. We leverage hand-level temporal information to update the hand prior memory, injecting this prior knowledge into the Dynamic Spatio-temporal Block to provide robust disambiguation cues for spatio-temporal interactions. Here, N represents the number of stacked blocks.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "09", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/09_三维视觉与神经渲染/P151/figures/P151_F2_p03.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "091aece704287839e8a265991fe13fbe4f38e5ff54510590e404f8ae1897cbce"}, {"id": "P152_F1_p02", "title": "S3R-GS: Streamlining the Pipeline for Large-Scale Street Scene Reconstruction", "category": "09_三维视觉与神经渲染", "layout_style": "L09", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.pdf", "figure_number": "1", "pdf_page": 2, "caption": "Figure 1. Comparison of Reconstruction Pipelines. (a) In the conventional pipeline, to render the view at timestep t, each object’s Gaussians are sequentially transformed from their respective local coordinate system to the global coordinate system. Next, all Gaussians in the global coordinate system are projected onto the camera plane. Finally, the Gaussians within the view frustum are rendered using α-blending, regardless of distance. (b) Our streamlined reconstruction pipeline first employs temporal visibility to identify the visible Gaussians at timestep t. To avoid unnecessary transformations, we use instance-specific projection matrices to directly project all Gaussians onto the camera plane. Subsequently, we apply the Adaptive LOD method to cull distant Gaussians whose 2D scales are smaller than the LOD threshold. We rasterize the remaining Gaussians with α-blending. Finally, we update the temporal visibility using Gaussian visibility obtained by the rendering process. (c) Our pipeline eliminates these redundancies, significantly accelerating the reconstruction process.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "09", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/10_计算机系统与数据流程/P152/figures/P152_F1_p02.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "4a51e4bd27bebddb453bbd3d487ca5355e591907fc771228afaa1ac6779dbb1e"}, {"id": "P152_F2_p03", "title": "S3R-GS: Streamlining the Pipeline for Large-Scale Street Scene Reconstruction", "category": "09_三维视觉与神经渲染", "layout_style": "L04", "visual_style": "V04", "source_url": "https://openaccess.thecvf.com/content/ICCV2025/html/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.html", "pdf_url": "https://openaccess.thecvf.com/content/ICCV2025/papers/Zheng_S3R-GS_Streamlining_the_Pipeline_for_Large-Scale_Street_Scene_Reconstruction_ICCV_2025_paper.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2. S3R-GS Framework. At the scene modeling stage, S3R-GS first leverages a BEV-semantic initialization augmentation method to supplement the points of tall structures in street scenes. Next, tracked 2D boxes to distinguish between dynamic and static elements, integrating a NeuralODE model for precise, continuous object poses. These designs enable S3R-GS to generalize effectively to in-the-wild scenarios. During scene reconstruction, S3R-GS identifies visible Gaussians at each time step and projects them onto the 2D image plane using instance-specific projection matrices. To efficiently render distant content, S3R-GS employs an adaptive strategy that (1) filters out distant 3D Gaussians with small projected 2D scales, (2) randomly culls Gaussians based on depth, (3) introduces noisy offsets to the remaining distant Gaussians, and (4) queries their colors from a distance-aware neural field. After that, the remaining Gaussians are rasterized using α-blending. Our pipeline reduces computational redundancy, significantly lowering per-viewpoint reconstruction costs.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "09", "kind": "paper_reference", "year": 2025, "venue": "ICCV", "image": "references/10_计算机系统与数据流程/P152/figures/P152_F2_p03.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "9b9f1f4bcb8706b71c7d1a9fd31797a9edc1f5fd79217f13e782c51a1c2bba10"}, {"id": "P153_F2_p03", "title": "Causality-guided Prompt Learning for Vision-language Model ic semantic changes. Finally, we train a diffusion model as an inherent semantic planner conditioned on given inputs.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "04", "kind": "paper_reference", "year": 2025, "venue": "ACL", "image": "references/04_生成模型与扩散机制/P175/figures/P175_F2_p04.png", "description": "训练机制与学习流程", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "93ef58a907cfc80ea47e5e27516578a5f5292c77af8263431afbedad36b824a8"}, {"id": "P176_F3_p05", "title": "CART : A Generative Cross-Modal Retrieval Framework With Coarse-To-Fine Semantic Modeling", "category": "05_检索增强与知识系统", "layout_style": "L09", "visual_style": "V01", "source_url": "https://aclanthology.org/2025.acl-long.735/", "pdf_url": "https://aclanthology.org/2025.acl-long.735.pdf", "figure_number": "3", "pdf_page": 5, "caption": "Figure 3: The architecture of the CART.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "05", "kind": "paper_reference", "year": 2025, "venue": "ACL", "image": "references/04_生成模型与扩散机制/P176/figures/P176_F3_p05.png", "description": "网络架构图", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "1725d9443aff5c1fd6837d63d2ba652d5727107bd843d49462a2cf37f7b747a9"}, {"id": "P177_F3_p04", "title": "Modality-Aware Neuron Pruning for Unlearning in Multimodal Large Language Models", "category": "06_多模态与跨模态融合", "layout_style": "L01", "visual_style": "V05", "source_url": "https://aclanthology.org/2025.acl-long.295/", "pdf_url": "https://aclanthology.org/2025.acl-long.295.pdf", "figure_number": "3", "pdf_page": 4, "caption": "Figure 3: The overall framework of MANU. The forget and retain sets are first split into text-only and multi- modal modalities. Neuron activations are then computed across modalities and datasets, followed by applying an importance and scoring function to evaluate activated neurons. Finally, the top α% of neurons are pruned based on their scores.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "06", "kind": "paper_reference", "year": 2025, "venue": "ACL", "image": "references/06_多模态与跨模态融合/P177/figures/P177_F3_p04.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "76b0b019bbe2450a7b3898dbfeb84f5dff4abecbdd707f86e07ad79a10cc16a6"}, {"id": "P178_F1_p01", "title": "FACT - AUDIT : An Adaptive Multi-Agent Framework for Dynamic Fact-Checking Evaluation of Large Language Models", "category": "07_强化学习与智能体", "layout_style": "L09", "visual_style": "V04", "source_url": "https://aclanthology.org/2025.acl-long.17/", "pdf_url": "https://aclanthology.org/2025.acl-long.17.pdf", "figure_number": "1", "pdf_page": 1, "caption": "Figure 1: The pipelines of the existing solution and the proposed FACT-AUDIT in fact-checking evaluation.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "07", "kind": "paper_reference", "year": 2025, "venue": "ACL", "image": "references/07_强化学习与智能体/P178/figures/P178_F1_p01.png", "description": "方法流程图", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "0327b98d10ecd35e407840897a9d7ffbad5699bfaa26a3face6ccd102a9a49fd"}, {"id": "P178_F2_p04", "title": "FACT - AUDIT : An Adaptive Multi-Agent Framework for Dynamic Fact-Checking Evaluation of Large Language Models", "category": "07_强化学习与智能体", "layout_style": "L07", "visual_style": "V04", "source_url": "https://aclanthology.org/2025.acl-long.17/", "pdf_url": "https://aclanthology.org/2025.acl-long.17.pdf", "figure_number": "2", "pdf_page": 4, "caption": "Figure 2: An overview of FACT-AUDIT, to adaptively unveil the limitations of fact-checking in LLMs.", "crop_note": "机制图形裁剪；图注见元数据", "style_review": "人工按缩略图检查主布局与视觉表达；不是会议官方风格标准", "batch": "v2-2025-expansion", "topic": "07", "kind": "paper_reference", "year": 2025, "venue": "ACL", "image": "references/07_强化学习与智能体/P178/figures/P178_F2_p04.png", "description": "机制示意与总体框架", "source_kind": "official_proceedings", "copy_note": "官方会议公开论文版本", "rights": "Original authors/publisher; check source license", "image_sha256": "9bb7290b9b61e87788011fc770a30720d61f893d791b860ab448c76e82d06019"}, {"id": "P179_F2_p03", "title": "A Triple-View Framework for Fine-Grained Emotion Classification with Clustering-Guided Contrastive Learning", "category": "08_训练策略与自监督", "layout_style": "L02", "visual_style": "V05", "source_url": "https://aclanthology.org/2025.acl-long.247/", "pdf_url": "https://aclanthology.org/2025.acl-long.247.pdf", "figure_number": "2", "pdf_page": 3, "caption": "Figure 2: The overall framework of TACO. Here we visualize the case of classifying three emotion labels (i.e., disgust, admiration and approval), in which admiration and approval are closely confusable. The three emotion labels are painted in different colors in the diagram. Additionally, the instance embedding and the label embedding share the same color with their corresponding emotion label. For the initialization, utterance instances and emotion label descriptions are encoded independently into a unified embedding space via the same encoder. Subsequently, three complementary views optimize the obtained embeddings with the aim of increasing inter-class variation and intra-class coherence from different perspectives, followed by a view combination module to fuse the knowledge from them. For simplicity, the clustering-guided contrastive loss, cross-entropy loss and label-aware disentangled loss are denoted by CCL, CE and LDL in the diagram, respectively.", "  "visual_style": "V01", "description": "上下 token 对应边展示模态对齐和交互机制，可改为稀疏或全连接交互。", "topic": "06", "kind": "original_blueprint", "year": 2026, "venue": "原创结构蓝图", "image": "templates/06_多模态与跨模态融合/T48_modality_token_alignment.png", "rights": "MIT; original generic structure, not an exact paper reproduction", "source_url": null, "keywords": "替换模块名称、输入输出和张量维度。 保留主要信息流方向，新增分支放在空白区域。 虚线仅表示辅助联系；按真实方法修改箭头语义。", "image_sha256": "ee0da993757bb5e9b741670210677c32d54a2bb1df87c87899440efa876db43f"}], "taxonomy": {"version": 2, "classification_note": "本库人工整理的表达方式标签，不是任何会议期刊的官方绘图规范；配色为绘制建议，未从每张原图精确取色。", "layouts": [{"id": "L01", "name": "线性流水线", "slug": "linear-pipeline", "definition": "单条主链横向或纵向推进，输入、变换与输出顺序清楚。", "use_when": "输入到输出的顺序方法、数据处理、推理流程。", "avoid_when": "把真正并行的模态硬挤成一条链。", "prompt_clause": "Use one aligned main pipeline with consistent module sizes; show each transformation in reading order. Route auxiliary links outside the main chain.", "suggested_aspect_ratio": "2:1"}, {"id": "L02", "name": "多分支与汇合", "slug": "parallel-fusion", "definition": "多条并行编码/处理支路，明确融合、共享或分叉节点。", "use_when": "多模态、双编码器、教师学生、多个任务头。", "avoid_when": "支路交叉或共享模块语义不清。", "prompt_clause": "Use parallel aligned lanes for the branches, explicit merge/split nodes and a clearly labelled fusion operation. Keep shared and branch-specific modules distinct.", "suggested_aspect_ratio": "2:1"}, {"id": "L03", "name": "层级编码解码", "slug": "hierarchical-encoder-decoder", "definition": "按层级、分辨率或网络深度排列，跨层联系与跳连可见。", "use_when": "U-Net、FPN、层级网络、深层展开。", "avoid_when": "没有层级意义却使用复杂U形。", "prompt_clause": "Arrange the network by depth or resolution; align corresponding encoder/decoder levels. Route skip connections in reserved gutters and distinguish add from concat when supplied.", "suggested_aspect_ratio": "3:2"}, {"id": "L04", "name": "模块总览与局部放大", "slug": "modular-inset", "definition": "外层方法总览加子模块容器/插图，建立整体到细节的层级。", "use_when": "复杂总体框架与一个核心创新模块。", "avoid_when": "各插图同等拥挤、放大框与总图没有对应。", "prompt_clause": "Create a clear overview and one or two bounded detail insets. Repeat module identifiers to connect overview and detail; group boundaries must not look like data-flow arrows.", "suggested_aspect_ratio": "2:1"}, {"id": "L05", "name": "节点关系与消息传递", "slug": "node-link-graph", "definition": "显式节点与边，邻居、关系类型或聚合目标以位置/颜色区分。", "use_when": "GNN、知识图谱、因果DAG、关系推理。", "avoid_when": "把模块之间所有箭头都叫消息传递。", "prompt_clause": "Draw explicit node-link graphs with visible adjacency and relation labels where required. Distinguish internal illustrative graph edges from directed system-flow arrows; highlight the target node and aggregation only if specified.", "suggested_aspect_ratio": "3:2"}, {"id": "L06", "name": "token矩阵与算子展开", "slug": "token-matrix-operator", "definition": "用token条、矩阵、张量或离散序列展现操作过程。", "use_when": "注意力、mask、patch、索引编码与张量机制。", "avoid_when": "将概念矩阵画成带数值结果的统计热图。", "prompt_clause": "Use token strips, tensor tiles and operator nodes to expose the computation. Preserve supplied tensor dimensions and sequence order; schematic colors encode roles, not fabricated measurements.", "suggested_aspect_ratio": "2:1"}, {"id": "L07", "name": "迭代与反馈回路", "slug": "iteration-feedback", "definition": "重复步骤、训练更新或环境交互以回路/时间箭头表达。", "use_when": "扩散逆过程、优化更新、RL、工具循环。", "avoid_when": "给只读检索系统添加不存在的回答回写。", "prompt_clause": "Make iteration direction and the repeated unit explicit. Route feedback outside the forward path; draw a loop only when the supplied edge list contains it. Separate interaction, learning and control links.", "suggested_aspect_ratio": "2:1"}, {"id": "L08", "name": "分阶段泳道", "slug": "stage-swimlane", "definition": "离线/在线、训练/推理、客户端/服务端等按容器分轨。", "use_when": "RAG离线在线、训练测试、系统分层工作流。", "avoid_when": "把分组边界当连线或将阶段混在同一轨。", "prompt_clause": "Use labelled stage or responsibility swimlanes. Align chains within each lane and route cross-lane links through a clear gutter. Stage containers are grouping devices; cross-stage read/write directions must follow the brief.", "suggested_aspect_ratio": "2:1"}, {"id": "L09", "name": "多面板机制对照", "slug": "multi-panel-comparison", "definition": "以(a)(b)等面板对照结构或机制变化，保留相同基准位置。", "use_when": "基线与新方法、不同阶段、不同机制设计。", "avoid_when": "用实验结果曲线替代机制对照。", "prompt_clause": "Use comparable panels with aligned input/output positions and consistent visual vocabulary. Emphasize structural differences with one accent color; panels compare mechanisms, not invented numerical performance.", "suggested_aspect_ratio": "2:1"}, {"id": "L10", "name": "概念示意与场景隐喻", "slug": "conceptual-scene", "definition": "图标、人物、物体或几何场景解释任务、概念与动作。", "use_when": "任务动机、具身环境、科学机制直观说明。", "avoid_when": "装饰场景代替算法结构或暗示无根据的生物因果。", "prompt_clause": "Use a restrained explanatory scene or a few consistent icons, connected to the stated mechanism. Keep illustration subordinate to scientific meaning; do not add decorative characters or new claims.", "suggested_aspect_ratio": "3:2"}, {"id": "L11", "name": "树状层级与路由", "slug": "tree-hierarchy", "definition": "自顶向下层次、树节点、搜索路径或分层服务栈。", "use_when": "层次池化、树检索、任务路由、系统栈。", "avoid_when": "把一般DAG误画成只能有单父节点的树。", "prompt_clause": "Use a clear hierarchy with aligned levels and labelled parent-child or routing relations. Preserve multiple parents if the supplied structure is a DAG; do not force it into a tree.", "suggested_aspect_ratio": "3:2"}], "visuals": [{"id": "V01", "name": "扁平柔和色块", "slug": "flat-muted", "definition": "白底、低饱和模块填充、细描边、少量圆角。", "suggested_palette": "#E4EDF6 / #E4F0E8 / #EEE7F4 / #FFF1D7", "prompt_clause": "Flat academic vector-like appearance on white; muted blue, green, lavender and amber functional groups; thin consistent dark-slate outlines; no shadows or gradients."}, {"id": "V02", "name": "单色细线", "slug": "monochrome-line", "definition": "黑白/灰色线稿，通过边框与线型区分语义。", "suggested_palette": "#FFFFFF / #E5E7EB / #475569 / #111827", "prompt_clause": "Monochrome line art with white and light-gray fills, crisp black/gray outlines and high legibility. Encode distinctions by labels and shapes rather than color alone."}, {"id": "V03", "name": "张量层叠与轻透视", "slug": "tensor-isometric", "definition": "特征图、张量或网络层以堆叠片、薄立方体和轻透视表达。", "suggested_palette": "#CBDDED / #D3E6D3 / #ECDDC2 / #D9D1E8", "prompt_clause": "Represent supplied feature maps or tensors as thin stacked slabs with restrained consistent isometric perspective. Keep labels flat and legible; avoid glossy rendering, lighting effects or gratuitous depth."}, {"id": "V04", "name": "图标场景与框图混合", "slug": "icon-scene-hybrid", "definition": "输入样例/场景/图标与模块框图并置，明确图示角色。", "suggested_palette": "#E4EDF6 / #F3E6C9 / #DCE8DE / #243247", "prompt_clause": "Combine clean flat process blocks with a small number of restrained explanatory icons or input-scene thumbnails. Keep a consistent illustration language and ample whitespace; scene content is schematic unless a real input is provided."}, {"id": "V05", "name": "彩色节点关系图", "slug": "colored-node-link", "definition": "彩色节点和细边，以颜色表示节点角色或关系种类。", "suggested_palette": "#8CCFC5 / #E7BA7A / #A8A1D5 / #8CAED0", "prompt_clause": "Use muted colored circular nodes and fine neutral graph edges; reserve one stronger accent for the target or active neighborhood. Provide labels or a compact legend for semantic node roles, without fabricating graph measurements."}, {"id": "V06", "name": "高对比模块强调", "slug": "high-contrast-modules", "definition": "较强色彩区分路径或新增模块；保持有限颜色。", "suggested_palette": "#4878B8 / #D9655B / #75A66D / #2F3542", "prompt_clause": "Use a limited high-contrast palette for major branches, with a single accent highlighting the stated contribution. Keep the background white and text dark; avoid neon, glow and visual clutter."}]}, "counts": {"source_papers": 184, "paper_references": 223, "original_blueprints": 48, "portable_png_images": 271, "topic_categories": 12, "layout_styles": 11, "visual_styles": 6, "new_papers": 52, "new_paper_references": 61}}, $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let page=0;const size=24,L=Object.fromEntries(DATA.taxonomy.layouts.map(x=>[x.id,x])),V=Object.fromEntries(DATA.taxonomy.visuals.map(x=>[x.id,x]));

function tags(x){return `<span class="tag">${esc(L[x.layout_style].name)}</span><span class="tag">${esc(V[x.visual_style].name)}</span>`}
function render(){const rows=current(),total=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,total-1);$('summary').textContent=`当前 ${rows.length} 张 · 可组合主题、布局、视觉与来源类型筛选。`;$('page').textContent=`${page+1} / ${total}`;$('prev').disabled=page===0;$('next').disabled=page===total-1;$('grid').innerHTML=rows.slice(page*size,(page+1)*size).map(x=>`<article class="card"><div class="thumb" data-id="${esc(x.id)}"><img src="${encodeURI(x.image)}" alt="${esc(x.id+' '+x.title)}" loading="lazy"></div><div class="body"><div class="meta">${esc(x.id)} · ${esc(x.category.slice(3))}</div><h3>${esc(x.title)}</h3><div class="tags">${tags(x)}</div><div class="meta">${x.kind==='original_blueprint'?'原创通用结构 · MIT':esc(x.venue+' '+x.year+' · Figure '+x.figure_number+' · PDF 第 '+x.pdf_page+' 页')}</div><div class="actions"><button data-id="${esc(x.id)}">风格详情</button><a href="${encodeURI(x.image)}" download>PNG</a></div></div></article>`).join('')||'<p>没有匹配项，请放宽一个风格条件。</p>';$('grid').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>detail(el.dataset.id))}
function detail(id){const x=DATA.catalog.find(x=>x.id===id),l=L[x.layout_style],v=V[x.visual_style];if(!x)return;const prompt='Layout: '+l.prompt_clause+'\nStyle/medium: '+v.prompt_clause+'\nSuggested palette: '+v.suggested_palette+'\nReference role: visual grammar only; replace all algorithm modules and edges with your own verified method.';$('detailbody').innerHTML=`<h2>${esc(x.id+' · '+x.title)}</h2><div class="tags">${tags(x)}</div><img src="${encodeURI(x.image)}" alt="${esc(x.id)}"><p>${esc(l.definition)}<br>${esc(v.definition)}</p><p>适合：${esc(l.use_when)}<br>避免：${esc(l.avoid_when)}</p><p class="meta">${x.kind==='original_blueprint'?esc(x.rights):esc(x.venue+' '+x.year+' · 图 '+x.figure_number+' · PDF 第 '+x.pdf_page+' 页 · '+x.copy_note)}</p>${x.source_url?`<a href="${esc(x.source_url)}" target="_blank" rel="noopener">正式论文出处</a>`:''}<p>${esc(x.crop_note||x.description)}</p><h3>可组合的提示片段</h3><textarea readonly aria-label="风格提示片段">${esc(prompt)}</textarea><p>这是风格片段；完整提示词还应包含真实节点、箭头、分组和精确文字。</p><p class="meta">${esc(x.caption||'原创结构蓝图；不是论文算法的精确复刻。')}</p>`;if(!$('detail').open)$('detail').showModal()}
['q','topic','layout','visual','kind'].forEach(id=>$(id).oninput=()=>{page=0;render()});$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail'))$('detail').close()};render();
</script></body></html>
